  to{opacity:0;max-height:0;transform:translateY(-6px)}}
.fee-body.unravel{animation:feeunravel 360ms cubic-bezier(.4,0,.2,1);overflow:hidden}
.fee-body.ravel{animation:feeravel 360ms cubic-bezier(.4,0,.2,1) both;overflow:hidden}
.fee-field{display:grid;gap:6px;margin:0 0 14px;padding:0 0 14px;
  border-bottom:1px solid var(--rail-line)}
.fee-group .fee-field:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.fee-field .fee-label{font-size:13px;font-weight:600;color:var(--rail-ink-2);line-height:1.3}
.fee-field.done .fee-label{color:var(--rail-ink)}
/* Two columns by default; the level's two controls set their own from the
   schema's lists, so a framework with four points would still lay out. */
.fee-seg{display:grid;grid-template-columns:1fr 1fr;
  border:1px solid var(--rail-input-border,#52739C);border-radius:4px;overflow:hidden}
.fee-seg button+button{border-left:1px solid var(--rail-input-border,#52739C)}
.fee-seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 6px;cursor:pointer;
  background:var(--rail-input-bg,#1D2F4B);color:var(--rail-ink-2);border:0;line-height:1.2}
.fee-seg button+button{border-left:1px solid var(--rail-input-border,#52739C)}
.fee-seg button:hover{color:var(--rail-ink)}
.fee-seg button[aria-pressed="true"]{background:var(--rail-accent,var(--accent));
  color:var(--rail-accent-ink,#fff)}
.fee-seg button:disabled{cursor:default;opacity:.6}
.fee-seg button:focus-visible{outline:2px solid var(--rail-focus,#8FB4FF);outline-offset:-2px}
/* the card's own line: delivery version, adjustments, and the way in (D55) */
.fee-card{margin:6px 0 0;font-size:12px;color:var(--rail-ink-3);line-height:1.5}
/* What the level costs, under the control that sets it (F2). The money leads,
   because that is the figure the proposal is written around. */
.fee-outcome{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 10px;margin:9px 0 0;
  padding:8px 10px;border-radius:5px;background:var(--rail-input-bg,#1D2F4B);
  border:1px solid var(--rail-input-border,#52739C)}
.fee-outcome b{font-family:var(--f-num);font-size:17px;font-weight:700;color:var(--rail-ink,#fff);
  font-variant-numeric:tabular-nums;line-height:1.1}
.fee-outcome span{font-family:var(--f-num);font-size:13px;color:var(--rail-ink-2)}
.fee-outcome small{flex:1 0 100%;font-size:11.5px;color:var(--rail-ink-3)}
.fee-outcome.none{display:block;font-size:12.5px;color:var(--rail-ink-3);background:none;border-style:dashed}
/* the way into the card, under the toggle that turns fees on */
.fee-view{width:100%;margin:9px 0 0;font-size:12.5px;padding:6px 10px;
  background:var(--rail-input-bg,#1D2F4B);border:1px solid var(--rail-input-border,#52739C);
  color:var(--rail-ink);border-radius:4px;cursor:pointer}
.fee-view:hover{border-color:var(--rail-accent,var(--accent))}
.fee-view:focus-visible{outline:2px solid var(--rail-focus,#8FB4FF);outline-offset:2px}
/* ── the rate card panel (D55) ──
   The mandate dialog's chrome, widened for a six-column grid. A cell shows
   the rate in force; amber means an adjustment is saved on top of the
   delivered rate, blue means changed here and not yet saved. */
.dialog.wide{width:min(940px,calc(100vw - 32px))}
/* The card can be opened from inside the repository console (D58), so it
   stacks above that dialog and its scrim rather than under them. */
#feeDialog .scrim{z-index:94}
#feeDialog .dialog{z-index:95}
/* ── the fee card (D55), laid out to be read at a glance ──
   A short head (what delivery this is), one row of controls (which way the
   card is turned, and which slice), then the grid. Three things carry the
   emphasis and nothing else does: the two source groups are visibly two
   groups; the column of the level this proposal prices at is heavier and
   tinted; and, pivoted by fee group, the one cell that is THIS mandate's rate
   - its tier crossed with that level - wears a ring. Everything else is
   quiet, so those three read first. */
.dialog.rc{padding:22px 26px 20px}
.rc-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:0 0 16px;padding-right:36px}
.dialog.rc .rc-head h2{margin:0}
.rc-meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0;font-family:var(--f-num);font-size:12.5px;
  color:var(--ink-3)}
.rc-meta b{color:var(--ink-2);font-weight:600}
.rc-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:0 0 12px}
.rc-seg{display:flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.rc-seg button{appearance:none;border:0;border-left:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.rc-seg button:first-child{border-left:0}
.rc-seg button:hover{background:var(--surface-2);color:var(--ink)}
.rc-seg button[aria-selected="true"]{background:#16243A;color:#fff;font-weight:600}
.rc-seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rc-axis{width:auto;min-width:240px;font-size:13px}
.rc-loading{color:var(--ink-3);font-size:13px;margin:12px 0}
.rc-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:var(--radius)}
.rate-grid{border-collapse:collapse;width:100%;font-size:13px}
.rate-grid th,.rate-grid td{padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  height:38px;vertical-align:middle}
.rate-grid thead th{font-family:var(--f-num);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-2);font-weight:700;text-align:right;height:30px}
/* the two source groups: a spanning head with its own rule, and a stronger
   line plus a little air where one group becomes the next */
.rate-grid th.src{text-align:center;border-bottom:1px solid var(--line-strong);height:32px;
  font-size:11.5px;letter-spacing:.14em;color:var(--ink-2)}
.rate-grid th.src span{display:inline-block;padding:0 6px 3px;border-bottom:2px solid var(--ink-3)}
/* its own name, not .grp: the page has a .grp + .grp rule for stacked
   groups that would otherwise pad the second source head down */
.rate-grid .rc-grp{border-left:2px solid var(--line-strong);padding-left:20px}
.rate-grid thead th.rowhead{text-align:left;vertical-align:bottom;padding-bottom:8px}
/* the row head: an id set as a small pill, the band beside it, a tag when it
   is this mandate's own row */
.rate-grid tbody th.rowhead{text-align:left;font-weight:500;color:var(--ink);min-width:220px;
  display:flex;align-items:center;gap:9px;height:38px}
.rc-id{font-family:var(--f-num);font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:4px;padding:1px 7px;line-height:17px;
  min-width:34px;text-align:center}
.rc-lbl{font-size:13px;color:var(--ink)}
.rc-tag{margin-left:auto;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#1E4FA3;background:#E3EBFA;border-radius:8px;padding:0 7px;line-height:16px}
/* the level this proposal prices at: heavier, tinted, named in its head */
.rate-grid th.lvl{color:#1E4FA3;background:#E9F0FB}
.rate-grid th.lvl small{display:block;font-size:9px;letter-spacing:.08em;font-weight:700;color:#1E4FA3;
  opacity:.85;margin-top:1px}
.rate-grid td.lvl{background:#F3F7FD;font-weight:700;color:#16243A}
/* this mandate's own row */
.rate-grid tr.mark td,.rate-grid tr.mark th.rowhead{background:#F0F4FB}
.rate-grid tr.mark td.lvl{background:#E3EBFA}
.rate-grid tr.mark th.rowhead{box-shadow:inset 3px 0 0 var(--accent)}
.rate-grid tr.mark .rc-id{background:#fff;border-color:#B9CDF0;color:#1E4FA3}
/* the one cell that is this mandate's rate */
.rate-grid td.ring{box-shadow:inset 0 0 0 2px var(--accent);border-radius:3px;color:#1E4FA3}
.rate-grid td.rate{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;
  color:var(--ink-2);min-width:74px;font-size:13.5px}
.rate-grid tbody tr:last-child td,.rate-grid tbody tr:last-child th{border-bottom:none}
.rate-grid tbody tr:hover td:not(.lvl),.rate-grid tbody tr:hover th.rowhead{background:var(--row-hover,var(--surface-2))}
.rate-grid tbody tr.mark:hover td:not(.lvl),.rate-grid tbody tr.mark:hover th.rowhead{background:#E9EFF9}
/* the key: one swatch per emphasis, in the order they appear */
.rc-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.rc-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;
  border:1px solid var(--line-strong);background:var(--surface)}
.rc-legend i.k-unit{border-style:dashed}
.rc-legend i.k-lvl{background:#E9F0FB;border-color:#B9CDF0}
.rc-legend i.k-mark{background:#F0F4FB;border-color:#B9CDF0;box-shadow:inset 3px 0 0 var(--accent)}
.rc-legend i.k-ring{box-shadow:inset 0 0 0 2px var(--accent);background:#E3EBFA;border-color:transparent}
.rc-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}

/* ── the step-2 greeting (D97) ──
   The document dims and the rail does not: the panel the card is about is the
   one thing left legible, and it wears the guide's own focus blue. The card
   sits against the rail's edge with a pointer into it; below the rail's
   stacking breakpoint there is no edge to sit against, so it centres and the
   scrim covers everything. The rail is lit but INERT - nothing behind the
   card is clickable until OK, which is the only way out. */
#greetDialog .scrim{z-index:92}
#greetDialog .dialog{z-index:96}
.greet-scrim{left:var(--rail-w)}
body.rail-collapsed .greet-scrim{left:var(--rail-w-collapsed,48px)}
body.greeting .rail{z-index:93;box-shadow:0 0 0 2px var(--rail-focus,#8FB4FF),10px 0 34px rgba(143,180,255,.3)}
.dialog.greet{width:min(390px,calc(100vw - 32px));top:132px;left:calc(var(--rail-w) + 26px);
  transform:none;padding:20px 22px 18px}
body.rail-collapsed .dialog.greet{left:calc(var(--rail-w-collapsed,48px) + 26px)}
.dialog.greet::before{content:"";position:absolute;left:-9px;top:38px;width:16px;height:16px;
  background:var(--surface);border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);
  transform:rotate(45deg)}
.greet-eyebrow{margin:0 0 6px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.dialog.greet h2{margin:0 0 10px;font-size:19px;line-height:1.25}
.greet-lede{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.greet-cats{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.greet-cats li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--surface-2);
  border-radius:var(--radius-sm);font-size:13px;color:var(--ink-2)}
.greet-cats li b{color:var(--ink);font-weight:600}
.greet-cats li i{font-style:normal;font-family:var(--f-num);font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--ink-3)}
.greet-left{margin:11px 0 0;font-size:13px;color:var(--ink-2)}
.greet-acts{display:flex;justify-content:flex-end;margin:16px 0 0}
/* stacked: the rail is above the document, so there is no edge to point at */
@media (max-width:1039px){
  .greet-scrim{left:0}
  .dialog.greet{top:50%;left:50%;transform:translate(-50%,-50%)}
  .dialog.greet::before{display:none}
  body.greeting .rail{box-shadow:0 0 0 2px var(--rail-focus,#8FB4FF)}
}

/* ── custom fees (D96) ──
   The fee card's by-tier grid with one column added, the PWA's. The chosen
   schedule's rows are live; the other schedule's stay for reference, and
   their Custom cell is inert. The rail block under the level lists the rows. */
#customDialog .scrim{z-index:94}
#customDialog .dialog{z-index:95}
.dialog.cf{width:min(1060px,calc(100vw - 32px))}
.cf-tools .cf-lbl{font-size:13px;color:var(--ink-2)}
.cf-grid tbody th.rowhead{min-width:232px}
.cf-grid td.rate{min-width:56px;padding:0 9px}
.cf-grid .rc-grp{padding-left:14px}
.cf-cnt{display:block;font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;line-height:1.2}
.rate-grid th.cust,.rate-grid td.cust{border-left:2px solid var(--accent);background:#F7FAFF;
  text-align:right;white-space:nowrap;min-width:172px}
.rate-grid thead th.cust{color:#1E4FA3;vertical-align:bottom;padding-bottom:8px}
.rate-grid tr.off td,.rate-grid tr.off th.rowhead,.rate-grid tr.off .rc-lbl{color:var(--ink-3)}
.rate-grid tr.off td.cust{background:var(--surface-2)}
.rc-id-blank{visibility:hidden}
.cf-copy{appearance:none;background:none;border:1px dashed transparent;border-radius:3px;padding:2px 5px;
  font:inherit;color:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
.cf-copy:hover,.cf-copy:focus-visible{border-color:var(--accent);color:#1E4FA3;outline:none}
.rate-grid td.cust .cf-in{width:84px;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;
  font-size:13.5px;padding:4px 7px;height:auto}
.rate-grid td.cust .cf-in:disabled{background:var(--surface-2);color:var(--ink-3);border-style:dashed;cursor:not-allowed}
.rate-grid td.cust small{display:inline-block;font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);margin-left:8px;min-width:62px;text-align:left}
.rate-grid td.cust.bad .cf-in{border-color:var(--neg);background:#FDE8E8}
.rate-grid tr.mark td.cust{background:#EEF3FC}
.cf-actions{display:flex;gap:8px}
/* the custom sleeve builder (D170) */
.dialog.csl{width:min(980px,calc(100vw - 32px));padding:22px 26px 20px;max-height:calc(100vh - 32px);overflow:auto}
.csl-head{margin:0 0 14px;padding-right:36px}
.csl-head h2{margin:0 0 4px}
.csl-fields{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;align-items:center;
  margin:0 0 14px;font-size:13px}
.csl-fields > label,.csl-fields > .lbl{font-weight:600;color:var(--ink-2)}
.csl-fields input,.csl-fields select{font:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line-strong);
  border-radius:4px;background:var(--surface);color:var(--ink);width:100%;max-width:520px}
.csl .rc-seg{display:inline-flex}
.csl .rc-seg button[aria-pressed="true"]{background:#16243A;color:#fff;font-weight:600}
.csl-hint{margin:5px 0 0;font-size:12.5px;color:var(--ink-3);max-width:70ch}
.csl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.csl-tbl{border-collapse:collapse;width:100%;font-size:13px}
.csl-tbl th,.csl-tbl td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.csl-tbl thead th{font-family:var(--f-num);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;background:var(--surface-2);white-space:nowrap}
.csl-tbl tbody th b{display:block;font-weight:600}
.csl-tbl tbody th small,.csl-tbl td small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.csl-tbl .num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.csl-tbl td.below{color:#9B1C1C;font-weight:600}
.csl-tbl td.below small{color:#9B1C1C}
.csl-tbl tr.gone th b{color:#9B1C1C}
.csl-tbl input{width:78px;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;
  padding:4px 6px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.csl-tbl input[aria-invalid="true"]{border-color:var(--neg);background:#FDE8E8}
.csl-rm{appearance:none;background:none;border:0;font-size:17px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 5px}
.csl-rm:hover{color:#9B1C1C}
.csl-tools{margin:8px 0 0}
.csl-empty{margin:8px 0;font-size:13px;color:var(--ink-3)}
.csl-add{margin:16px 0 0;border-top:1px solid var(--line);padding-top:12px}
.csl-add-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px}
.csl-add-h h3{margin:0;font-size:14px}
.csl-add-h .mut{font-size:12px;color:var(--ink-3)}
.csl-add-h input{margin-left:auto;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line-strong);
  border-radius:4px;min-width:220px}
.csl-list{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:240px;overflow:auto}
.csl-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 8px;
  border:1px solid var(--line);border-radius:4px}
.csl-pn b{display:block;font-size:13px;font-weight:600}
.csl-pn small{font-size:11.5px;color:var(--ink-3)}
.csl-actions{align-items:center}
.csl-foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.csl-tot b.ok{color:#176A33}
.csl-tot b.no{color:#8A5A00}
.csl-tot .mut{color:var(--ink-3)}
.csl-chips{display:flex;flex-wrap:wrap;gap:5px}
.csl-chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;letter-spacing:.02em}
.csl-chip.ok{background:#E6F3EC;color:#176A33}
.csl-chip.warn{background:#FBF1DC;color:#8A5A00}
.csl-chip.bad{background:#FDE8E8;color:#9B1C1C}
.csl-discard{color:#9B1C1C}
@media (max-width:640px){.csl-fields{grid-template-columns:1fr}}
.cf-rows{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:3px;font-size:12.5px;color:var(--rail-ink-2)}
.cf-rows li{display:flex;justify-content:space-between;gap:8px}
.cf-rows b{color:var(--rail-ink);font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.cf-rows li.miss b{color:var(--rail-eyebrow,#F3C46B)}

/* ── how this mandate is priced (D84) ──
   The build-up behind a marginal blend. It borrows the fee card's head, wrap
   and actions; what is its own is the four-column sum and the level strip. */
.dialog.pb{width:min(700px,calc(100vw - 32px));padding:22px 26px 20px}
.pb-sub{margin:-8px 0 14px;font-size:13px;color:var(--ink-3);line-height:1.45}
.pb-grid{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.pb-grid th,.pb-grid td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:right}
.pb-grid thead th{font-family:var(--f-num);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-2);font-weight:700}
.pb-grid th:first-child,.pb-grid thead th:first-child{text-align:left}
.pb-grid td{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.pb-grid tbody th{font-weight:400}
.pb-id{font-family:var(--f-num);font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:3px;
  padding:1px 6px;margin-right:9px}
.pb-band{color:var(--ink-2);font-size:13px}
.pb-grid tfoot th,.pb-grid tfoot td{border-top:2px solid #16243A;border-bottom:0;font-weight:700;
  padding-top:11px;color:var(--ink)}
.pb-eff{color:var(--accent);font-size:15px}
.pb-how{margin:14px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.pb-h{margin:18px 0 8px;font-family:var(--f-num);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.pb-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.pb-lv{border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;
  background:var(--surface)}
.pb-lv.on{border-color:var(--accent);background:#E9F0FB}
.pb-lv b{display:block;font-family:var(--f-num);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:2px}
.pb-lv.on b{color:#1E4FA3}
.pb-lv span{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.pb-lv.on span{color:var(--accent)}
.rc-note{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.dialog .md-err{margin-top:12px}

/* ── sleeve pickers in the rail ── */
.sl-list{display:grid;gap:9px}
.sl-row{display:grid;gap:5px}
.sl-row .cat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sl-row .cat b{font-size:13px;font-weight:600;color:var(--rail-ink-2);line-height:1.3}
.sl-row .cat span{font-family:var(--f-num);font-size:12px;color:var(--rail-ink-3);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.sl-row.done .cat b{color:var(--rail-ink)}
/* the guided picker (D95) takes the same mark as a guided field (D91) */
.sl-row.is-next .cat b{color:var(--rail-ink)}
/* Only the bar: the count is already beside the Sleeves heading, and the
   sentence repeated both of them (D2). */
.sl-progress{margin:12px 0 0}
.sl-bar{display:block;height:4px;border-radius:2px;background:#22334E;overflow:hidden;margin:0}
.sl-bar i{display:block;height:100%;background:var(--rail-accent);transition:width .2s}
/* What the chosen sleeve holds and costs, at this category's weight (C2).
   The figures are the same ones the table builds its weighted fee from. */
.sl-shape{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--f-num);font-size:11.5px;
  color:var(--rail-ink-3);letter-spacing:.02em;margin-top:1px}
.sl-shape .bad{color:#F3A9A2;font-weight:700}
/* custom sleeves in the rail (D170): the sleeve marked, its Edit, the
   strategic weight a custom one replaced, and whether the book adds to 100% */
.sl-shape.sl-custom{align-items:center}
.sl-cchip{font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:0 7px;border-radius:9px;background:#3A2C55;color:#D9C6F5;border:1px solid #6B559A;line-height:16px}
.sl-edit{appearance:none;background:none;border:0;padding:0;font:inherit;font-size:12px;font-weight:600;
  color:var(--rail-accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sl-edit:focus-visible{outline:2px solid var(--rail-accent);outline-offset:2px}
.sl-shape .mut{color:var(--rail-ink-3);font-style:italic}
.sl-was{color:var(--rail-ink-3);margin-left:4px;font-size:11px}
.sl-bal{margin:0 0 4px;padding:8px 10px;border-radius:4px;font-size:12.5px;line-height:1.45;
  color:var(--rail-ink-2);border:1px solid var(--rail-line)}
.sl-bal.bad{border-color:#B9645A;background:rgba(185,100,90,.16);color:#F7D2CD}
.sl-bal.ok{border-color:#3F7A5A;background:rgba(63,122,90,.16)}
.sl-bal b{color:var(--rail-ink);font-family:var(--f-num)}

/* ── implementation table ── */
/* 30px below, matching .sec-head.stage-head - both steps open on the same
   block and must stand off their tables identically. */
.impl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;margin:0 0 30px}
.impl-gate{margin:0;font-size:14px;color:var(--ink-2)}

/* ── completion progress, from proposalToolv2's .completion-summary ──
   Replaces the pill that only ever said one of two things. Sits opposite the
   stage block, which .impl-head's space-between already positions. */
.completion-summary{min-width:230px}
.completion-line{display:flex;justify-content:space-between;gap:15px;
  font-family:var(--f-num);color:var(--ink-2);font-size:12px;margin-bottom:5px}
.completion-line strong{color:var(--ink);font-variant-numeric:tabular-nums}
/* The state that actually gates the download, beside the count (D2). */
.cs-state{font-weight:700;text-align:right;white-space:nowrap}
.cs-state.ready{color:#176A33}
.cs-state.blocked{color:#B45309}
.cs-state.error{color:#9B1C1C}
/* ── the same state, where the work happens (B4) ──
   The card at the foot is several screens below the table a change was just
   made to, so the consequence is also said directly under it. */
.impl-state{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin:12px 0 0;
  padding:10px 14px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.5;
  background:var(--surface-2);color:var(--ink-2);border-left:3px solid var(--line-strong)}
.impl-state b{font-family:var(--f-num);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
  white-space:nowrap;color:var(--ink)}
.impl-state.ready{background:#E7F4EC;border-left-color:#176A33}
.impl-state.ready b{color:#176A33}
.impl-state.blocked{background:#FEF3C7;border-left-color:#B45309}
.impl-state.blocked b{color:#B45309}
.impl-state.error{background:#FDE8E8;border-left-color:#9B1C1C}
.impl-state.error b{color:#9B1C1C}
/* a named product is the way to its row (B3) */
.gate-go{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;
  font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.gate-go:hover{color:#9B1C1C}
.gate-go:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
/* the row it lands on, lit long enough to be found */
.tbl.impl tr.lit th,.tbl.impl tr.lit td,.tbl.impl tr.lit .prodcol{animation:impllit 2.4s ease-out}
@keyframes impllit{0%,55%{background:#FDF0C4}100%{background:transparent}}
.sl-row.lit{animation:sleevelit 2.4s ease-out}
@keyframes sleevelit{0%,55%{background:rgba(143,180,255,.22)}100%{background:transparent}}
.progress-track{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress-track i{display:block;height:100%;width:var(--progress);background:#176A33;
  transition:width .2s ease}
.progress-track.is-done i{background:#176A33}

/* ── export card, from proposalToolv2 ──
   Its structure verbatim; its greens, ambers and reds swapped for the ones
   this page's badges already use, so the card reads as part of the document
   rather than as a borrowed one. */
.impl-viz{padding-bottom:44px;border-bottom:1px solid var(--line-strong)}
.export-card{margin:44px 0 0;padding:24px 26px;display:grid;
  grid-template-columns:60px 1fr auto;gap:20px;align-items:center;
  background:var(--surface);border:1px solid var(--line-strong);
  border-left:4px solid #176A33;border-radius:7px;box-shadow:var(--shadow)}
.export-icon{width:50px;height:58px;display:grid;place-items:center;position:relative;
  background:#E7F4EC;border:1px solid #B7E0C5;border-radius:4px;color:#176A33;
  font-family:var(--f-num);font-size:20px;font-weight:750}
.export-icon:after{content:"";position:absolute;right:0;top:0;border-style:solid;
  border-width:0 0 12px 12px;border-color:transparent transparent #B7E0C5 transparent}
.export-copy h3{margin:0;font-family:var(--f-num);font-size:23px;font-weight:520;
  color:#16243A}
.export-copy>p:not(.eyebrow){margin:4px 0;color:var(--ink-2);font-size:13px}
/* Scoped through .export-copy rather than carrying v2's !important: the
   generic paragraph rule above is (0,2,1) because of its :not(), so a bare
   .export-gate.blocked at (0,2,0) loses the colour it is there to set. */
.export-copy>p.export-gate{font-weight:650}
.export-copy>p.export-gate.ready{color:#176A33}
.export-copy>p.export-gate.blocked{color:#B45309}
.export-copy>p.export-gate.error{color:#9B1C1C}
.btn-export{background:#176A33;color:#fff;border-color:#176A33;min-width:180px}
.btn-export:hover:not(:disabled){background:#12572a;border-color:#12572a}
@media (max-width:719px){
  .export-card{grid-template-columns:1fr;gap:14px}
  .export-icon{display:none}
  .btn-export{width:100%}
}
/* Narrower by the three fee columns when the proposal excludes them (D52).
   The width is transitioned so the table closes up as the columns collapse
   rather than snapping when the render lands. */
/* Smaller type than the step 1 tables carry: this one is 23 columns wide and
   read across, where those are read down. .tbl sets 15px for both. */
.tbl.impl{min-width:1690px;transition:min-width var(--col-motion);font-size:13px}
/* The document's cap is for reading down step 1; this table is read across,
   so while it is showing the document takes the whole screen beside the rail,
   as it already does with the rail folded. A wide enough screen then shows
   every column with no horizontal scroll. */
body.has-rail.step-impl .shell{max-width:none}
.tbl.impl.no-fees,.tbl.impl.fees-out{min-width:1340px}
.tbl.impl td.txt{white-space:nowrap}
/* both identity columns stay pinned while the attribute and money columns scroll */
/* Column 1 sizes to its longest label rather than a fixed 248px. Column 2 is
   pinned immediately after it, so its sticky offset has to follow: the
   implementation renderer measures column 1 after each paint and publishes
   the width as --impl-c1. The 248px fallback is the spec 9.3 value, used
   until the first measurement lands. */
.tbl.impl .rowhead{width:1%}
.tbl.impl .prodcol{position:sticky;left:var(--impl-c1,248px);z-index:1;width:1%;
  border-right:1px solid var(--line-strong)}
.tbl.impl thead .prodcol{z-index:4;background:var(--head-bg)}
.tbl.impl tr.asset .prodcol{background:var(--surface);color:var(--ink)}
/* The products column bands with the row it is in, not against it - the green
   was the only place on the page using that tint. */
.tbl.impl tr.asset.alt .prodcol{background:var(--surface)}
.tbl.impl tr.cat .prodcol{background:#E9EDF2}
.tbl.impl tr.grand .prodcol{background:#16243A}
/* The total row keeps its navy on hover: the row-hover tint washed the
   white text off it. Every other row still lights up. */
.tbl.impl tbody tr:not(.grand):hover .prodcol{background:var(--row-hover)}
/* ── narrow: one pinned column, not two (H1) ──
   At an 840px document the two pinned columns measured 449px - 53% of
   everything visible - leaving a 391px window onto thirteen more. Two frozen
   columns and a peephole is not a table. Below the rail's own breakpoint the
   product column scrolls with the rest, and the category column is capped and
   allowed to wrap rather than holding a whole line of text open. */
@media (max-width:1039px){
  .tbl.impl .prodcol{position:static;z-index:auto}
  .tbl.impl thead .prodcol{z-index:2}
  .tbl.impl thead tr.grp th.gpin.g2{position:static}
  .tbl.impl .rowhead{max-width:34vw}
  .tbl.impl tbody th,.tbl.impl thead th.rowhead{white-space:normal;line-height:1.25}
}
.tbl.impl td.txt,.tbl.impl th.txt{text-align:left}
.tbl.impl .tick{font-family:var(--f-num);color:var(--ink-2);letter-spacing:.02em}
.tbl.impl tr.cat td.num{font-weight:700}
.tbl.impl tr.grand th,.tbl.impl tr.grand td{background:#16243A;color:#fff;font-weight:700;
  border-top:2px solid #16243A}
.tbl.impl tr.grand th{background:#16243A}
.tbl.impl tbody tr.grand:hover th,.tbl.impl tbody tr.grand:hover td{background:#16243A;color:#fff}
/* A position below its product's minimum: a hard block, so it reads as one
   and the export says why. */
.tbl.impl tr.below-min th,.tbl.impl tr.below-min td{background:#FDE8E8;color:#7A1D1D}
/* The pinned products cell carries .asset here for the same reason the header
   z-index fix carries its weight (D72): tr.asset.alt above is (0,5,1) and would
   otherwise repaint every banded breaching row white while the rest of the row
   went pink. Matched at equal weight and declared later, rather than escalated. */
.tbl.impl tr.asset.below-min .prodcol{background:#FDE8E8}
.tbl.impl tbody tr.below-min:hover th,.tbl.impl tbody tr.below-min:hover td,
.tbl.impl tbody tr.below-min:hover .prodcol{background:#FBD9D9}
.tbl.impl tr.below-min .bdg.b-breach{margin-left:8px;vertical-align:middle}
/* The breach beside the name, in the column that is always on screen (B2).
   The row's pink fill was the only carrier of it at rest - the badge that
   explained it sat 753px to the right - which is colour alone, and a
   background pale enough to vanish on a meeting-room projector. */
.bdg.b-breach.sm{font-size:9.5px;letter-spacing:.07em;padding:0 5px;line-height:15px;
  margin-left:6px;vertical-align:1px}
/* and the minimum it breaches, under its own notional */
.vs-min{display:block;font-family:var(--f-num);font-size:10.5px;font-weight:400;
  letter-spacing:.02em;color:#9B1C1C;line-height:1.2;margin-top:-1px}
/* what the implemented total is a total OF, while it is not all of it (D1) */
.of-all{display:block;font-family:var(--f-num);font-size:10.5px;font-weight:400;
  letter-spacing:.03em;color:rgba(255,255,255,.72);line-height:1.2;margin-top:-1px}
/* the sleeve pill: its name is the way back to the picker that set it (C3) */
.pill-go{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  cursor:pointer;border-radius:3px}
.pill-go:hover{text-decoration:underline;text-underline-offset:2px}
.pill-go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill .pc{font-size:9.5px;font-weight:700;opacity:.72;margin-left:5px;letter-spacing:.02em}
/* attached by rule: a labelled glyph, not an emoji (G2) */
.pill-lock{width:9px;height:9px;margin-left:5px;vertical-align:-1px;opacity:.7}
.pill.p-sleeve.is-auto{cursor:default}
/* a custom sleeve (D170): the same pill in violet, and the strategic weight it
   replaced under the band's own */
.pill.p-sleeve.is-custom{background:#F1EBF9;color:#5B3591;border:1px solid #C7B3E3}
td small.was{display:block;font-family:var(--f-num);font-size:10.5px;font-weight:400;color:var(--ink-3);
  text-decoration:line-through;line-height:1.2}
.pill{display:inline-block;font-family:var(--f-num);font-size:11px;font-weight:700;
  letter-spacing:.04em;padding:1px 7px;border-radius:9px;white-space:nowrap}
.p-act{background:#E3EBFA;color:#1E4FA3;border:1px solid #B9CDF0}
.p-pas{background:#EEF1F4;color:#5B6B7C;border:1px solid #D8DEE6}
.p-sma{background:#E7F4EC;color:#176A33;border:1px solid #B7E0C5}
.p-etf{background:#FEF3C7;color:#B45309;border:1px solid #F3D48A}
.p-mf{background:#F3EDF9;color:#5B4380;border:1px solid #D9CCEA}
.p-int{background:#E8EEF5;color:#1E4FA3;border:1px solid #C4D5E8}
.p-ext{background:#F5F1E8;color:#7A5C2E;border:1px solid #E0D3BC}
.p-ucits{background:#E4F1F4;color:#1C5A69;border:1px solid #BCDCE4}
.p-icav{background:#EDEBF6;color:#453A7A;border:1px solid #CFC9E6}
.p-sleeve{background:#EEF1F4;color:#5B6B7C;border:1px solid #D8DEE6}
/* the fee group (D51): struck through, not removed, under a schedule that
   does not read it - the column still says what the product is */
.p-grp{background:#EEF1F4;color:#3E4E60;border:1px solid #D8DEE6}
/* ── the fee columns arriving and leaving (D52) ──
   A column has no width of its own: it takes it from the widest cell. So the
   animation runs on two things at once - the cell's side padding, and a span
   around the content whose max-width is what the column measures. Together
   they open the column from nothing and close it back to nothing, with the
   contents fading over the top. The leave fills forwards, because it has to
   hold the collapsed state until the render that removes the cells. */
.tbl.impl .fcw{display:inline-block;max-width:220px;overflow:hidden;
  white-space:nowrap;vertical-align:middle}
@keyframes feecolin{from{opacity:0;padding-left:0;padding-right:0}}
@keyframes feecolout{to{opacity:0;padding-left:0;padding-right:0}}
@keyframes feespanin{from{max-width:0;opacity:0}}
@keyframes feespanout{to{max-width:0;opacity:0}}
.tbl.impl.fees-in th.fee-col,.tbl.impl.fees-in td.fee-col{
  animation:feecolin 360ms ease-out}
.tbl.impl.fees-in .fcw{animation:feespanin 360ms cubic-bezier(.4,0,.2,1)}
.tbl.impl.fees-out th.fee-col,.tbl.impl.fees-out td.fee-col{
  animation:feecolout 360ms ease-in both}
.tbl.impl.fees-out .fcw{animation:feespanout 360ms cubic-bezier(.4,0,.2,1) both}
/* ── the initial allocation's twins (D136) ──
   For a book that holds private markets the three twins - Initial (%),
   Initial notional, Initial fee, each beside its long-term column - are always
   in the table, collapsed to nothing. A column measures its widest cell, so the
   side padding and a span's max-width are transitioned together, as the fee
   columns' are (D52), but on a class rather than a render: the motion plays
   both ways. Teal marks the initial world against the navy long-term one. */
.ini-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.ini-btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;
  color:#0F243E;background:#fff;border:1.5px solid #0F243E;border-radius:6px;padding:7px 13px;cursor:pointer;
  transition:background-color 360ms ease,color 360ms ease,border-color 360ms ease}
.ini-btn:hover{background:#EEF2F7}
.ini-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ini-btn svg{width:16px;height:16px;flex:none}
.ini-btn[aria-pressed="true"]{background:#0B5345;border-color:#0B5345;color:#fff}
.ini-note{font-size:12.5px;color:var(--ink-2,#4A5A6B)}
.ini-note i{display:inline-block;width:9px;height:9px;border-radius:2px;background:#0B5345;
  margin-right:6px;vertical-align:-1px}
.ini-note b{color:#0B5345}
.ini-fee{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:bottom;
  transition:max-width 360ms ease,opacity 360ms ease}
.ini-bar.ini-on .ini-fee{max-width:460px;opacity:1}
.tbl.impl .ini{transition:padding 360ms cubic-bezier(.4,0,.2,1),background-color 360ms ease,
  box-shadow 360ms ease}
.tbl.impl.has-ini:not(.ini-on) .ini{padding-left:0;padding-right:0}
.tbl.impl .iw{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;
  vertical-align:middle;transition:max-width 360ms cubic-bezier(.4,0,.2,1),opacity 360ms ease}
.tbl.impl.ini-on .iw{max-width:220px;opacity:1}
/* the green rule closes each Long-term / Initial pair on its right (D146;
   it opened the initial column on its left) */
.tbl.impl.ini-on .ini{box-shadow:inset -2px 0 0 #7FB8A6}
.tbl.impl.ini-on thead tr:not(.grp) th.ini{background:#DDEFE8;color:#0B5345}
.tbl.impl.ini-on tbody td.ini{background:#EAF5F1}
.tbl.impl.ini-on tbody tr.cat td.ini{background:#D5ECE4;color:#0B5345}
.tbl.impl.ini-on tbody tr.grand td.ini{background:#0B4A3F;color:#fff}
.tbl.impl td.ini .mv{font-weight:700;color:#0B5345}
.tbl.impl td.ini .zero{color:#8B98A6}
.tbl.impl td.ini small.called,.tbl.impl td.ini small.up{display:block;font-family:var(--f-num);
  font-size:10.5px;font-weight:500;line-height:1.2}
.tbl.impl td.ini small.called{color:#6A4290}
.tbl.impl td.ini small.up{color:#0B5345}
/* the row above the header that names each figure's world; it does not stick,
   so the sticky header never lands on top of it */
.tbl.impl thead tr.grp th{position:static;background:var(--surface,#fff);border:0;
  padding-top:0;padding-bottom:0;transition:padding 360ms ease}
.tbl.impl tr.grp .gh{width:0;min-width:100%;max-height:0;opacity:0;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;transition:max-height 360ms ease,opacity 360ms ease}
.tbl.impl.ini-on thead tr.grp th{padding-top:7px;padding-bottom:4px}
.tbl.impl.ini-on tr.grp .gh{max-height:40px;opacity:1}
/* its cells over the two pinned columns pin with them, opaque, so the world
   labels slide under them when the table scrolls across (D146) - as the
   header row's own corner does */
.tbl.impl thead tr.grp th.gpin{position:sticky;z-index:6;background:var(--surface,#fff)}
.tbl.impl thead tr.grp th.gpin.g1{left:0}
.tbl.impl thead tr.grp th.gpin.g2{left:var(--impl-c1,248px)}
.tbl.impl tr.grp th.lt .gh{color:#0F243E;border-bottom:2px solid #0F243E;padding-bottom:3px}
.tbl.impl tr.grp th.ini .gh{color:#0B5345;border-bottom:2px solid #0B5345;padding-bottom:3px}
@media (prefers-reduced-motion:reduce){
  .tbl.impl .ini,.tbl.impl .iw,.tbl.impl thead tr.grp th,.tbl.impl tr.grp .gh,.ini-fee,.ini-btn{transition:none}
}
/* Remove control inside the sleeve pill. Sized to stay inside an 11px pill
   without stretching it, and given a real hit area by the negative margin
   rather than by growing the pill. */
.pill-x{appearance:none;border:0;background:none;cursor:pointer;padding:0 0 0 5px;
  margin:0 -2px 0 1px;font:inherit;font-size:13px;line-height:1;color:inherit;
  opacity:.65;vertical-align:-1px}
.pill-x:hover{opacity:1;color:var(--neg,#B42318)}
.pill-x:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px;
  opacity:1}
/* ── composition doughnuts, between the table and the download ── */
.impl-viz{margin:46px 0 0}
.impl-viz-head{margin:0 0 14px}
.impl-viz-head h3{margin:0 0 3px;font-family:var(--f-display);font-size:17px;color:#16243A;
  font-weight:600}
.impl-viz-head .sec-note{margin:0}
/* auto-fit rather than five fixed tracks: the row holds five across on a wide
   document and folds to three, then two, without a breakpoint per step - and
   it keeps working if a sixth attribute is ever added. */
.dn-row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.dn-card{background:var(--surface);border:1px solid var(--line-strong);
  border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:14px 15px 12px;min-width:0;
  display:flex;flex-direction:column;align-items:center}
.dn-card h4{margin:0 0 10px;font-family:var(--f-num);font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);font-weight:700;align-self:flex-start}
.dn{width:118px;height:118px;display:block;transform:rotate(-90deg)}
.dn-arc{transition:stroke-dasharray .25s ease,stroke-dashoffset .25s ease}
.dn-key{list-style:none;margin:11px 0 0;padding:0;width:100%;display:grid;gap:3px}
.dn-key li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  line-height:1.35}
.dn-sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.dn-nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-pc{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink);
  flex:0 0 auto}
.impl-empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:clamp(28px,5vw,52px);text-align:center}
.impl-empty h3{margin:0 0 7px;font-size:18.5px;color:#16243A;font-family:var(--f-display)}
.impl-empty p{margin:0 auto;max-width:44ch;font-size:15px;color:var(--ink-2)}


/* ── the sleeve repository console (D57) ──
   An overlay on the dialog base, sized to the viewport rather than to its
   content so each view's own boxes scroll and the footer stays put. */
.dialog.repo{width:min(1280px,calc(100vw - 32px));height:min(940px,calc(100vh - 32px));
  padding:0;display:flex;flex-direction:column;overflow:hidden}
/* A column of fixed bands around one band that takes the rest. Flex rather
   than a grid template because two of the bands - the unsaved-changes notice,
   the orphans notice - are only sometimes there, and a row template that
   counts children hands the wrong track to the wrong band when one is missing. */
.dialog.repo>.repo-h,.dialog.repo>.repo-f,.dialog.repo>.repo-notice{flex:0 0 auto}
/* The views sit inside the panel the tabs name (G1), so the band that takes
   the remaining height is that panel - and it passes the height on, because
   the panes inside it are what actually scroll. */
.dialog.repo>#repoPanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#repoPanel>.cat-tools,#repoPanel>.repo-notice{flex:0 0 auto}
#repoPanel>.repo-b,#repoPanel>.cat-b{flex:1 1 auto;min-height:0}
.repo-h{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;
  padding:12px 16px 12px 20px;border-bottom:1px solid var(--line-strong)}
/* The header carries a title, two segmented controls, the source line and the
   close button. Below full width there is not room for all of it: the source
   line goes first (the footer says the same thing), and wrapping is the
   backstop so a narrow window pushes a row down rather than clipping the last
   implementation type off the end. */
.dialog.repo .repo-h h2{margin:0;font-family:var(--f-num);font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink)}
.repo-seg{display:flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.repo-seg button{appearance:none;border:0;border-left:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;padding:6px 12px;
  cursor:pointer;white-space:nowrap}
.repo-seg button:first-child{border-left:0}
.repo-seg button:hover{background:var(--surface-2);color:var(--ink)}
.repo-seg button[aria-selected="true"]{background:#16243A;color:#fff;font-weight:600}
.repo-seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* The header's tabs scroll sideways rather than clip: at a narrow width the
   last of seven was cut off with no way to reach it (D155) */
.repo-h>.repo-seg{max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:thin}
.repo-h>.repo-seg button{flex:0 0 auto}
.repo-src{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.repo-h .repo-src{margin-left:auto}
.dialog.repo .dlg-close{position:static;margin-left:4px}
.repo-b{display:grid;grid-template-columns:232px 300px minmax(0,1fr);min-height:0}
/* The Sleeves view at the catalogue's width, so switching between the two
   does not jump (D115). */
.dialog.repo.sleeves{width:min(1560px,calc(100vw - 32px))}
.repo-pane{border-right:1px solid var(--line);min-height:0;overflow:auto;display:flex;flex-direction:column}
.repo-pane:last-child{border-right:0}
.repo-pane-h{font-family:var(--f-num);font-size:11.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:14px 16px 8px;display:flex;align-items:center;
  gap:8px;flex:0 0 auto;min-height:44px}
.repo-pane-h .btn{margin-left:auto;padding:5px 10px;font-size:11px}
.repo-fixed{display:inline-block;font-family:var(--f-num);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);
  border-radius:8px;padding:0 6px;line-height:16px;vertical-align:middle}
.repo-none{margin:10px 16px;font-size:13px;color:var(--ink-3)}
/* ── the sleeve search box (C1), in the Sleeves view's bar since D156 ── */
.repo-find{display:flex;align-items:center;gap:6px;margin:8px 12px 6px;padding:0 8px;
  border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink-3)}
.repo-find input{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);
  padding:6px 0;width:100%;outline:none;min-width:0}
.repo-find input::-webkit-search-cancel-button{-webkit-appearance:none}
.repo-find kbd{font-family:var(--f-num);font-size:10.5px;border:1px solid var(--line-strong);
  border-radius:3px;padding:0 5px;color:var(--ink-3);background:var(--surface-2)}
.repo-find:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,191,.18)}
/* ── the editor's own actions (A2) ──
   Archiving and adding an edition act on the sleeve being edited, so they sit
   where it is named rather than in the footer beside Save. */
.repo-ed-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.repo-ed-where{flex:1 1 auto;min-width:0;font-family:var(--f-num);font-size:11.5px;
  letter-spacing:.06em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-ed-act{appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:4px;padding:4px 9px;font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.repo-ed-act:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.repo-ed-act.danger{color:#9B1C1C;border-color:#F1B8B2}
.repo-ed-act.danger:hover:not(:disabled){background:#FDE8E8;border-color:#9B1C1C;color:#9B1C1C}
.repo-ed-act:disabled{opacity:.5;cursor:default}
.repo-ed-act:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.repo-ed-top.is-confirm{background:#FDE8E8;border:1px solid #F1B8B2;border-radius:5px;
  padding:10px 12px;margin-bottom:14px}
.repo-ed-warn{flex:1 1 220px;font-size:13px;color:#7A1D1D}
.repo-ed-top.is-confirm .btn{padding:5px 11px;font-size:12px}
/* a draft that outlived a reload (F1) */
.repo-kept{background:#E3EBFA;border-color:#B9CDF0!important;color:#1E4FA3}
.repo-kept .btn{padding:4px 10px;font-size:12px}
/* what the draft's state is, in the footer (F2) */
.repo-state{font-family:var(--f-num);font-size:12px;white-space:nowrap;color:var(--ink-3)}
.repo-state.is-dirty{color:#B45309;font-weight:700}
.repo-state.is-saved{color:#176A33}
/* the register: when and who are one cell (D3) */
.reg-tbl td.reg-when{white-space:nowrap;line-height:1.3}
.reg-tbl td.reg-when small{display:block;font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.reg-tbl td.reg-pwa{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-ed{padding:14px 20px 12px;gap:12px}
.repo-frow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}
.repo-fld{display:grid;gap:5px}
.repo-fld label{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2)}
.repo-fld input[type=text]{border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;
  font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);min-height:34px;width:100%}
.repo-fld input[aria-invalid="true"]{border-color:#B42318}
.repo-fld .ro{border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:13.5px;
  color:var(--ink-3);background:var(--surface-2);min-height:34px;display:flex;align-items:center;gap:6px}
.repo-prods{border:1px solid var(--line-strong);border-radius:6px}
.repo-prods .ph,.repo-prods .pr{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;
  align-items:center;gap:10px;padding:8px 12px}
.repo-prods .ph{font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.repo-prods .pr{border-bottom:1px solid var(--line);position:relative}
.repo-pick{appearance:none;background:none;border:1px solid transparent;border-radius:4px;
  text-align:left;font:inherit;padding:4px 6px;display:grid;gap:1px;min-width:0;cursor:pointer;
  color:var(--ink);line-height:1.3}
.repo-pick:hover{border-color:var(--line-strong)}
.repo-pick b{font-weight:500;font-size:13.5px}
.repo-pick small{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.repo-pick.empty b{color:var(--ink-3);font-weight:400}
.repo-pick .warn{color:#B45309;font-weight:600}
.repo-w{font-family:var(--f-num);font-size:13.5px;text-align:right;border:1px solid var(--line-strong);
  border-radius:4px;padding:5px 8px;width:96px;background:var(--surface);color:var(--ink)}
.repo-rm{appearance:none;background:none;border:0;color:var(--ink-3);font-size:18px;line-height:1;
  cursor:pointer;padding:4px}
.repo-rm:hover{color:#9B1C1C}
.repo-search{width:100%;border:1px solid var(--accent);border-radius:4px;padding:6px 10px;
  font:inherit;font-size:13.5px;box-shadow:0 0 0 3px rgba(31,95,191,.18);background:var(--surface);color:var(--ink)}
.repo-menu{position:absolute;left:12px;right:12px;top:calc(100% - 2px);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 10px 30px rgba(12,24,44,.18);
  z-index:5;max-height:280px;overflow:auto;margin:0;padding:0;list-style:none}
.repo-menu li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;line-height:1.3}
.repo-menu li:hover{background:var(--surface-2)}
.repo-menu li[aria-selected="true"]{background:#E3EBFA}
.repo-menu li b{font-weight:500}
.repo-menu li small{display:block;color:var(--ink-2);font-family:var(--f-num);font-size:12px}
.repo-menu .grp{font-family:var(--f-num);font-size:11.5px;color:#1E4FA3;background:#E3EBFA;
  border-radius:9px;padding:1px 8px;align-self:center;white-space:nowrap}
.repo-menu .hint{display:block;padding:6px 12px;font-family:var(--f-num);font-size:11.5px;
  color:var(--ink-3);background:var(--surface-2);cursor:default;border-bottom:0}
.repo-tot{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;gap:10px;padding:9px 12px;
  font-family:var(--f-num);font-size:13px;font-weight:700;background:var(--surface-2)}
.repo-tot .ok{color:#176A33;text-align:right}
.repo-tot .bad{color:#9B1C1C;text-align:right}
.repo-add{align-self:start;margin-top:8px}
.repo-problems{margin:0;font-size:12.5px;color:#7A4A0A}
.repo-prov{font-family:var(--f-num);font-size:12px;color:var(--ink-3);margin:auto 0 0;line-height:1.5}
.repo-empty,.repo-loading{margin:20px;color:var(--ink-3);font-size:14px}
.repo-notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;
  background:#FEF3C7;color:#7A4A0A;font-size:13px;border-bottom:1px solid #F3D48A}
.repo-notice .btn{padding:5px 10px;font-size:11px}
.repo-ed .repo-notice{border:1px solid #F3D48A;border-radius:4px;padding:9px 12px}
.repo-f{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line-strong);
  background:var(--surface-2)}
.repo-f .spacer{flex:1}
.repo-f .md-err{margin:0;padding:6px 10px}
.btn.btn-danger{color:#9B1C1C;border-color:#F1B8B2;background:var(--surface)}
.btn.btn-danger:hover{background:#FDE8E8}
/* the two answers only a new sleeve gives */
.repo-fld select{border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;
  font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);min-height:34px;width:100%}
.repo-vars{display:flex;flex-wrap:wrap;gap:6px 14px}
.repo-var{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer}
.repo-var.off{color:var(--ink-3);cursor:not-allowed}
/* ── editions (D89) ──
   A name's editions sit together under it in the list, indented, each
   saying which portfolios it is for. In the editor the edition is one
   field: the label, then the rules as rows of chips - one row per rule,
   rules being alternatives - and under them the count the server gives
   back, green when it is clean and red when it collides. */
.repo-edn .repo-sub{font-size:12px;color:var(--ink-3);line-height:1.45}
.repo-rules{display:grid;gap:8px}
.repo-rule{border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px 6px;display:grid;gap:6px;
  background:var(--surface)}
.repo-rule-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-num);
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.repo-rule-h small{font-weight:400;letter-spacing:.04em;color:var(--ink-3);margin-left:6px;text-transform:none}
.repo-rule-h .repo-rm{position:static;width:22px;height:22px}
.repo-rule-f{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:start}
.repo-rule-f .lbl{font-size:12px;color:var(--ink-2);padding-top:3px}
.repo-rule-f .chips{display:flex;flex-wrap:wrap;gap:4px}
.repo-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;
  border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px 2px 6px;background:var(--surface);
  line-height:18px;user-select:none}
.repo-chip:hover{border-color:var(--accent)}
.repo-chip.on{background:#E3EBFA;border-color:#1E4FA3;color:#1E4FA3;font-weight:600}
.repo-chip input{margin:0;width:12px;height:12px;accent-color:#1E4FA3}
.repo-applies{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.repo-applies.ok{color:#176A33}
.repo-applies.bad{color:#9B1C1C}
.rev-rules{margin:-4px 0 6px;font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
/* the context menu on a sleeve: inside the dialog, clamped off its edges */
.repo-ctx{position:absolute;z-index:8;min-width:238px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 12px 34px rgba(12,24,44,.24);
  padding:6px 0;display:grid}
.repo-ctx .h{margin:0;padding:7px 12px 6px;font-size:13.5px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line)}
.repo-ctx .h small{display:block;font-family:var(--f-num);font-size:11.5px;font-weight:400;color:var(--ink-3)}
.repo-ctx .lbl{margin:0;padding:8px 12px 4px;font-family:var(--f-num);font-size:10.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.repo-ctx .none{margin:0;padding:2px 12px 8px;font-size:12.5px;color:var(--ink-3)}
.repo-ctx .sep{margin:5px 0;border-top:1px solid var(--line)}
.repo-mi{appearance:none;background:none;border:0;text-align:left;font:inherit;font-size:13px;
  color:var(--ink);padding:7px 12px;cursor:pointer;width:100%}
.repo-mi:hover:not(:disabled){background:#E3EBFA;color:#1E4FA3}
.repo-mi:disabled{color:var(--ink-3);cursor:not-allowed}
.repo-mi.danger{color:#9B1C1C}
.repo-mi.danger:hover:not(:disabled){background:#FDE8E8;color:#9B1C1C}
.repo-mi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* ── the record: history and removed sleeves (D65) ──
   The history sits under the editor as a closed drawer, because most visits
   are to change a sleeve rather than to read what it was. Open, it is a
   ladder of revisions newest first: the change summary always visible, the
   whole composition one click further. The version in force is marked, and
   only the others offer to be put back - restoring what is already there is
   not an action, it is a no-op with a button. */
.repo-hist{margin:10px 0 0;border-top:1px solid var(--line)}
.repo-histh{display:flex;align-items:center;gap:8px;width:100%;appearance:none;background:none;
  border:0;font:inherit;font-family:var(--f-num);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:10px 0 9px;cursor:pointer;text-align:left}
.repo-histh:hover{color:var(--accent)}
.repo-histh .n{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:400;
  font-size:12px;color:var(--ink-3)}
.repo-histh .rev-caret{transition:transform .15s ease}
.repo-hist.open .repo-histh .rev-caret{transform:rotate(90deg)}
.repo-hist.open .repo-histh{color:var(--ink-2)}
.repo-hist-b{max-height:260px;overflow-y:auto;margin:0 -20px;padding:0 20px 8px;
  border-top:1px solid var(--line)}
.rev{border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev-h{display:flex;align-items:center;gap:10px;width:100%;appearance:none;background:none;
  border:0;font:inherit;color:var(--ink);padding:9px 0;cursor:pointer;text-align:left}
.rev-h:hover{color:var(--accent)}
.rev-n{font-family:var(--f-num);font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:9px;padding:1px 7px;line-height:16px;flex:none}
.rev.now .rev-n{background:#E3EBFA;color:#1E4FA3}
.rev-what{display:grid;gap:1px;min-width:0}
.rev-what b{font-size:13px;font-weight:600}
.rev-what small{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3)}
.rev-now{margin-left:auto;font-family:var(--f-num);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#176A33;background:#E7F4EC;
  border-radius:8px;padding:0 6px;line-height:16px;flex:none}
.rev-caret{margin-left:auto;color:var(--ink-3);font-size:15px;line-height:1;flex:none}
.rev-now + .rev-caret{margin-left:8px}
.rev.open .rev-caret{transform:rotate(90deg)}
.rev-changes{margin:0 0 8px;padding:0 0 0 32px;list-style:none;display:grid;gap:2px}
.rev-changes li{font-size:12px;color:var(--ink-2);line-height:1.4;position:relative}
.rev-changes li::before{content:"";position:absolute;left:-11px;top:7px;width:4px;height:4px;
  border-radius:50%;background:var(--line-strong)}
.rev-b{padding:0 0 10px 32px}
.rev-name{margin:0 0 6px;font-size:13px;font-weight:600}
.rev-name small{font-weight:400;color:var(--ink-3);font-size:12px}
.rev-products{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.rev-products li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;
  font-size:12.5px;line-height:1.4}
.rev-products .w{font-family:var(--f-num);font-weight:700;text-align:right;color:var(--ink-2)}
.rev-products .warn{color:#B45309;font-weight:600}
.rev-products.big li{font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.rev-products.big li:last-child{border-bottom:0}
.rev-put{margin-top:10px;padding:5px 11px;font-size:11.5px}
/* ── the archive and the activity feed (D66) ──
   Two more views on the same dialog, both wearing the catalogue's chrome so
   that one set of habits serves all three tables. The archive is a filing
   cabinet: a searchable table of what left the library, a batch tick, and a
   drawer for one sleeve with its history and the way back. The feed is a
   story: the record newest first, a day at a time, a sentence per change. */
.repo-seg [role="tab"] .n{margin-left:6px;font-family:var(--f-num);font-size:11px;font-weight:700;
  background:var(--surface-2);color:var(--ink-2);border-radius:8px;padding:0 6px;line-height:16px;
  display:inline-block;vertical-align:middle}
.repo-seg [role="tab"][aria-selected="true"] .n{background:rgba(255,255,255,.22);color:#FFF}

.arc-tools .cat-search,.act-tools .cat-search{flex:0 1 300px;min-width:200px}
.arc-sel{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:12px;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
  padding:0 4px 0 10px;height:28px}
.arc-sel>span{white-space:nowrap}
.arc-sel.on{border-color:var(--accent);background:#E3EBFA;color:#1E4FA3}
.arc-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;
  font-size:12px;font-weight:700;color:inherit;padding:0 18px 0 2px;height:26px;cursor:pointer;
  max-width:190px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 10px) 11px,calc(100% - 6px) 11px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.arc-sel select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.arc-export{margin-left:4px;padding:5px 10px;font-size:11px;text-decoration:none}
.arc-b{display:flex;flex-direction:column;min-height:0;flex:1}
.arc-tblwrap{flex:1;min-height:180px}
.arc-tbl td b{font-weight:600}
.arc-tbl td .mut,.arc-tbl td.mut{color:var(--ink-3)}
.arc-tbl .pinc input{width:14px;height:14px;margin:0;vertical-align:middle;cursor:pointer;accent-color:var(--accent)}
.arc-tbl tr.pin td{background:#F0F4FB}
.arc-tbl tr.on td{background:#E3EBFA}
.arc-tbl tr[data-arcrow]{cursor:pointer}
.arc-status{white-space:nowrap}
.arc-badge{font-family:var(--f-num);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  border-radius:8px;padding:1px 7px;line-height:16px;display:inline-block}
.arc-badge.gone{background:#FDE8E8;color:#9B1C1C}
.arc-badge.live{background:#E7F4EC;color:#176A33}
.arc-detail{border-top:1px solid var(--line-strong);background:var(--surface);padding:14px 20px 12px;
  max-height:44%;overflow-y:auto;flex:none}
.arc-dh{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.arc-dh h3{margin:0;font-size:17px;font-weight:700}
.arc-dh p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.arc-dh .repo-prov{margin:5px 0 0}
.arc-dact{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.arc-dact .repo-problems{max-width:34ch;text-align:right}
.arc-dclose{position:static;margin-left:4px}
.arc-db{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0 28px;margin-top:12px}
.arc-db .repo-hist{margin-top:0;border-top:0}
.arc-db .repo-hist-b{margin:0;padding:0 0 4px;max-height:220px}
.arc-lbl{padding:0 0 6px;border-bottom:0}
.arc-f .repo-src + .spacer{flex:1}
/* the feed */
.act-chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.act-chip{appearance:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
  font:inherit;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--ink-2);padding:0 9px;
  height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.act-chip .n{font-weight:400;color:var(--ink-3)}
.act-chip.on{background:#E3EBFA;border-color:var(--accent);color:#1E4FA3}
.act-chip.on .n{color:#1E4FA3}
.act-chip.off{opacity:.5}
.act-chip:hover:not(.off){border-color:var(--accent)}
.act-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.act-b{flex:1;overflow-y:auto;min-height:200px;background:var(--surface)}
.act-day{position:sticky;top:0;z-index:1;margin:0;padding:11px 20px 6px;font-family:var(--f-num);font-size:11px;
  font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);
  border-bottom:1px solid var(--line)}
.act-ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;padding:10px 20px;
  border-bottom:1px solid var(--line);align-items:start}
.act-ev .t{font-family:var(--f-num);font-size:12px;color:var(--ink-3);padding-top:2px}
.act-ev .w p{margin:0;font-size:13.5px}
.act-ev .w p b{font-weight:600}
.act-ev .w .mut{color:var(--ink-2)}
.act-ev .w small{display:block;font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);margin-top:1px}
.act-changes{margin:5px 0 0;padding-left:14px}
.act-changes li::before{left:-10px}
.act-ev .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.act-btn{padding:4px 9px;font-size:11px}
.act-badge{font-family:var(--f-num);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  border-radius:8px;padding:1px 7px;line-height:16px;display:inline-block;vertical-align:middle;margin:0 2px}
.act-badge.created,.act-badge.imported,.act-badge.seeded,.act-badge.baseline{background:var(--surface-2);color:var(--ink-2)}
.act-badge.updated{background:#E3EBFA;color:#1E4FA3}
.act-badge.reverted,.act-badge.restored{background:#FEF3C7;color:#7A4A0A}
.act-badge.deleted{background:#FDE8E8;color:#9B1C1C}
.act-badge.disabled{background:#EEF0F3;color:#4A5568}
.act-badge.enabled{background:#E3F2E8;color:#155F2E}
.act-none{padding:24px 20px;margin:0}
.act-more{padding:14px 20px 18px;text-align:center}
/* ── the proposal register (D69) ──
   A fifth table on the same dialog, in the catalogue's chrome. The list is
   dense and named-column; the open proposal sits below it with its two
   pictures behind a segmented toggle and the workbook one click away. The
   pictures are indented tables in their own right, so a category reads as
   a group head and its assets or products as the rows under it. */
/* One width for every view that holds a table, so moving between the tabs
   never resizes the card (D115, D117). */
.dialog.repo.register{width:min(1560px,calc(100vw - 32px))}
.reg-tools .cat-search{flex:0 1 280px;min-width:180px}
.reg-tbl td b{font-weight:600}
.reg-tbl td .mut,.reg-tbl .mut{color:var(--ink-3)}
.reg-tbl tr[data-regrow]{cursor:pointer}
.reg-tbl th.num,.reg-tbl td.num{padding-right:22px}
.arc-badge.acc{background:#E3EBFA;color:#1E4FA3}
.arc-badge.mute{background:var(--surface-2);color:var(--ink-2)}
.arc-badge.warn{background:#FEF3C7;color:#7A4A0A}
.arc-badge.ok{background:#EAF5EE;color:#176A33}
/* custom sleeves (D170): a proposal built with one, the weight a custom sleeve
   replaced, and what it held */
.arc-badge.cus{background:#F1EBF9;color:#5B3591}
.reg-pic small.reg-was{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);text-decoration:line-through}
.reg-pic tr.reg-custom td{font-size:12px;color:var(--ink-2);padding-top:2px}
.reg-pic tr.reg-custom span{margin-right:10px}
.reg-pic tr.reg-custom .btn{font-size:12px;padding:2px 9px}

/* ── the register, laid out as a list and a pane (D116) ── */
/* The saved views come before the filters: one press for the question people
   actually arrive with, and the count is worth reading before it is pressed. */
.reg-views{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 7px;border-bottom:1px solid var(--line);
  background:var(--surface)}
.reg-view{font-family:var(--f-body);font-size:12.5px;padding:6px 11px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);white-space:nowrap;transition:.14s}
.reg-view:hover{border-color:var(--accent);color:var(--accent)}
.reg-view b{font-family:var(--f-num);font-weight:700;margin-left:6px;color:var(--ink-3)}
.reg-view.on{background:#16243A;border-color:#16243A;color:#fff;font-weight:600}
.reg-view.on b{color:#AFC3DE}
.reg-view:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reg-filters{border-bottom:1px solid var(--line);background:var(--surface)}
/* what the rows in force come to, before a row is read */
.reg-stat{display:flex;gap:10px 26px;flex-wrap:wrap;margin:0;padding:9px 16px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.reg-stat div{min-width:0}
.reg-stat dt{font-family:var(--f-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:0}
.reg-stat dd{margin:1px 0 0;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--ink)}
/* the list and the record, side by side: reading one costs no rows */
.reg-b{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.reg-b.open{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.reg-b>.reg-list{min-height:0}
.reg-pane{min-width:0;min-height:0;overflow-y:auto;border-left:1px solid var(--line-strong);background:var(--bg)}
.reg-pane .reg-detail{max-height:none;border-top:0;background:transparent}
.reg-pane .arc-dh{flex-direction:column;gap:8px}
.reg-pane .arc-dact{margin-left:0;justify-content:flex-start}
.reg-pane .reg-pic-wrap{overflow-x:auto}
/* the id everything quotes, as a control rather than text to select */
.reg-uid{font-family:var(--f-num);font-size:12.5px;letter-spacing:.02em;color:var(--ink-2);
  background:none;border:0;border-bottom:1px dashed var(--line-mid);padding:1px 0;cursor:pointer}
.reg-uid:hover{color:var(--accent);border-bottom-color:var(--accent)}
.reg-uid:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reg-uid.copied{color:#176A33;border-bottom-color:#176A33}
.reg-uid.copied::after{content:" copied";font-size:10px;letter-spacing:.08em;text-transform:uppercase}
/* The register has no tick column to borrow a gutter from, so its first
   cell sat 10px off the card's edge. 16px puts the first column on the same
   line as the search box, the view chips and the summary above it (D118). */
.reg-tbl th:first-child,.reg-tbl td:first-child{padding-left:16px}
.reg-tbl th:last-child,.reg-tbl td:last-child{padding-right:16px}
.reg-tbl td.reg-size{line-height:1.3}
.reg-tbl td.reg-size small{display:block;font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);font-weight:400}
.reg-tbl td.reg-pwa small{display:block;font-family:var(--f-num);font-size:10.5px;color:var(--ink-3)}
@media (max-width:1100px){
  /* too narrow for two columns: the record goes back under the table, where
     it is the only thing that fits */
  .reg-b.open{grid-template-columns:minmax(0,1fr)}
  .reg-pane{border-left:0;border-top:1px solid var(--line-strong);max-height:52%}
}
.reg-detail{max-height:52%}
.reg-detail .arc-dact .repo-seg{margin-left:6px}
.reg-detail .arc-dact .btn-primary{text-decoration:none}
.reg-detail .repo-prov b.warn{color:#7A4A0A;font-weight:700}
.reg-pic-wrap{margin-top:12px;overflow-x:auto}
.reg-pic{width:100%}
.reg-pic th{position:static}
.reg-pic tr.grp td{background:var(--surface-2);font-weight:600}
.reg-pic td.sub{padding-left:26px;color:var(--ink-2)}
.reg-pic td.num{font-family:var(--f-num);text-align:right;white-space:nowrap}
.reg-pic th.num{text-align:right}
/* one portfolio, two columns: stretched to the drawer the weight sits a screen away
   from its label. Outranks .cat-tbl's own width rule by specificity. */
.reg-pic-wrap table.reg-pic-one{width:auto;min-width:480px;max-width:720px}
.reg-f .repo-src + .spacer{flex:1}
/* ── the admin entry points (D62) ──
   Two glyphs, three places, one job each: the rail's utility bar is where the
   tools LIVE, the icon on the sleeve tier is the shortcut from the thing that
   needs fixing, and the landing tiles are for an admin who came to maintain
   the library rather than write a proposal. All three hidden unless the
   schema says canAdmin. */
.rail-admin-bar{position:sticky;bottom:0;margin-top:auto;z-index:2;
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:#0E1C33;border-top:1px solid var(--rail-line)}
.rail-admin-cap{margin-right:auto;font-family:var(--f-num);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--rail-ink-3);white-space:nowrap}
.rail-admin-btn{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--rail-input-border,#52739C);border-radius:6px;
  color:var(--rail-ink-2);text-decoration:none;background:transparent;
  transition:background 120ms linear,color 120ms linear,border-color 120ms linear}
.rail-admin-btn svg{width:17px;height:17px;display:block}
.rail-admin-btn:hover{background:var(--rail-input-bg,#1D2F4B);color:#fff;border-color:#5590E4}
.rail-admin-btn:focus-visible{outline:2px solid var(--rail-focus,#8FB4FF);outline-offset:2px}
/* Collapsed, the bar is the only thing in the rail with anything to say: the
   caption goes and the glyphs stack down the 48px strip. */
body.rail-collapsed .rail-admin-cap{display:none}
body.rail-collapsed .rail-admin-bar{flex-direction:column;gap:6px;padding:9px 0}
body.rail-collapsed .rail-admin-btn{width:30px;height:30px}
/* the shortcut on the sleeve tier's own heading */
.tier-admin{width:24px;height:24px;flex:0 0 auto;display:grid;place-items:center;padding:0;
  border:1px solid transparent;border-radius:5px;background:none;color:var(--rail-ink-3);cursor:pointer}
.tier-admin svg{width:15px;height:15px;display:block}
.tier-admin:hover{color:#fff;border-color:var(--rail-input-border,#52739C)}
.tier-admin:focus-visible{outline:2px solid var(--rail-focus,#8FB4FF);outline-offset:1px}
.tier-h-r{display:flex;align-items:center;gap:9px}
/* ── the landing page's way into the library (D106) ──
   Aligned to the hero's own measure rather than bled to the edges: it is a
   footnote to the page, not a second surface laid over it. The role comes
   first and the destinations follow, so the strip explains its own presence
   before it offers anything.

   Everything here is inside #lpadmin, which is hidden outright for a
   non-admin, so none of it can leave a gap behind. */
/* In the landing grid's foot row, so it lines up with the copy above but
   sits at the bottom of the page rather than 38px under the last line of it.
   The margin is a floor for a short viewport, not the spacing itself (D108). */
.lp-admin{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;
  width:100%;max-width:1120px;margin:56px auto 0;padding:14px 0 0;
  border-top:1px solid var(--line-strong)}
.lp-admin[hidden]{display:none}
.lp-admin-who{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}
.lp-admin-who b{color:var(--ink);font-weight:600}
.lp-admin-role{font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;background:#16243A;color:#fff;border-radius:3px;padding:2px 7px;white-space:nowrap}
/* The destinations sit at the far end, so the eye reads role first and the
   two groups cannot be mistaken for one list. */
.lp-admin-links{display:flex;align-items:center;gap:7px 14px;flex-wrap:wrap;margin-left:auto}
.lp-admin-dot{color:var(--line-mid)}
.lp-admin-links a{font-size:13.5px;color:var(--ink-2);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:1px;transition:color 120ms linear}
.lp-admin-links a:hover{color:var(--accent);border-bottom-color:rgba(31,95,191,.4)}
.lp-admin-links a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
/* Narrow, the two groups stack and the destinations lead: on a tablet the
   role is reassurance and the links are the reason the strip is there. */
@media (max-width:640px){
  .lp-admin{gap:9px;margin:36px auto 0}
  .lp-admin-links{margin-left:0;order:-1;width:100%;gap:6px 16px}
  .lp-admin-links a{font-size:14.5px}
  /* The separators go once the row can wrap: a dot is bound to its
     neighbours by nothing, so a wrap leaves one stranded at the end of a
     line. The gap separates them well enough on its own. */
  .lp-admin-dot{display:none}
}
/* ── the catalogue view (D58), laid out as the terminal (D63) ──
   A facet rail, a dense table with the figures on the right, a tray of pins
   that opens into a comparison, a side panel on demand. Density is the
   point; colour is only ever a constraint (liquidity, a minimum above the
   mandate, a product no sleeve holds) or a selection. */
.dialog.repo.catalogue{width:min(1560px,calc(100vw - 32px))}
.cat-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.cat-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);padding:0 8px;width:270px;color:var(--ink-3)}
.cat-search input{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);padding:6px 0;width:100%;outline:none}
.cat-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.cat-search kbd{font-family:var(--f-num);font-size:10.5px;border:1px solid var(--line-strong);border-radius:3px;
  padding:0 5px;color:var(--ink-3);background:var(--surface-2)}
.cat-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,191,.18)}
.cat-density button{font-family:var(--f-num);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px}
.cat-chipwrap{position:relative}
.cat-chip{appearance:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);
  border-radius:14px;background:var(--surface);padding:3px 10px;font-family:var(--f-num);font-size:12px;
  color:var(--ink-2);cursor:pointer;white-space:nowrap;line-height:1.4}
.cat-chip:hover{border-color:var(--ink-3)}
.cat-chip.on{background:#E3EBFA;border-color:#B9CDF0;color:#1E4FA3;font-weight:700}
.cat-chip b{color:var(--ink);font-weight:700}
.cat-chip .car{font-size:9px;color:var(--ink-3)}
.cat-menu{position:absolute;left:0;top:calc(100% + 4px);min-width:210px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 10px 30px rgba(12,24,44,.18);
  z-index:6;padding:6px 0;display:grid}
.cat-opt{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:4px 12px;
  font-size:13px;cursor:pointer;color:var(--ink)}
.cat-opt.fixed{color:var(--ink-3)}
.cat-opt:hover{background:var(--surface-2)}
.cat-clear{appearance:none;background:none;border:0;padding:0;font:inherit;font-family:var(--f-num);font-size:12px;
  color:#1E4FA3;cursor:pointer;text-decoration:underline}
.cat-menu .cat-clear{margin:6px 12px 2px;justify-self:start}
.cat-count{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-3);white-space:nowrap}
.cat-orphans{gap:6px 14px}
.cat-orphan{font-size:12.5px}
/* the body: rail, table (or comparison), and the panel over the right edge */
.cat-b{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:0;position:relative}
.cat-facets{border-right:1px solid var(--line);overflow:auto;min-height:0;padding:6px 0 12px;background:var(--surface)}
.cat-fh{margin:0;padding:10px 14px 4px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.cat-fo{display:flex;align-items:center;gap:8px;padding:3px 14px;font-size:12.5px;color:var(--ink);cursor:pointer;line-height:1.35}
.cat-fo:hover{background:var(--surface-2)}
.cat-fo input{margin:0;width:12px;height:12px;flex:0 0 auto;accent-color:var(--accent)}
.cat-fo .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-fo .n{margin-left:auto;font-family:var(--f-num);font-size:11.5px;color:var(--ink-3)}
.cat-fo.on{color:#1E4FA3;font-weight:600}
.cat-fo.on .n{color:#1E4FA3}
.cat-fo.off{color:var(--ink-3);cursor:not-allowed}
.cat-facets-clear{margin:12px 14px 0}
.cat-tblwrap{overflow:auto;min-height:0}
.cat-tblwrap:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* the catalogue's own table (the archive and the register borrow the class):
   the header, and banded the band under it, stand over the rows, and a row
   the keyboard scrolls to has to come to rest clear of them */
