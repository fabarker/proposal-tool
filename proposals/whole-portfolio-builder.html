.ne-gridwrap{overflow-x:auto;border:1px solid var(--sv-frame);border-radius:8px}
.ne-grid{border-collapse:separate;border-spacing:0;width:100%;min-width:480px;background:var(--surface);table-layout:fixed}
.ne-grid th,.ne-grid td{padding:0;border-bottom:1px solid var(--sv-rule);border-right:1px solid var(--sv-rule)}
.ne-grid tr:last-child th,.ne-grid tr:last-child td{border-bottom:0}
.ne-grid th:last-child,.ne-grid td:last-child{border-right:0}
.ne-grid thead th{background:var(--sv-zone);border-bottom:1px solid var(--sv-frame)}
.ne-grid tbody th{background:var(--sv-zone);text-align:left;width:1%;white-space:nowrap}
.ne-corner{width:170px}
.ne-hd{appearance:none;width:100%;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:#16243A;padding:8px 10px;cursor:pointer;text-align:inherit}
.ne-hd:hover{box-shadow:inset 0 0 0 2px #1F5FBF}
.ne-hd[aria-pressed="true"]{background:#D6E2F5}
.ne-hd[aria-pressed="mixed"]{box-shadow:inset 3px 0 0 #1F5FBF}
thead .ne-hd[aria-pressed="mixed"]{box-shadow:inset 0 -3px 0 #1F5FBF}
.ne-hd[aria-pressed="mixed"]:hover{box-shadow:inset 3px 0 0 #1F5FBF,inset 0 0 0 2px #1F5FBF}
.ne-cell{appearance:none;width:100%;min-height:46px;border:0;background:var(--surface);font:inherit;color:var(--ink);padding:5px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.ne-cell b{font-size:14.5px;font-weight:600}
.ne-cell small{font-size:11.5px;line-height:1.2;color:var(--sv-ink2);overflow-wrap:anywhere}
.ne-cell.empty{cursor:default;color:var(--sv-ink2);background:var(--sv-zone2)}
.ne-cell.claimed{background:repeating-linear-gradient(135deg,#E7ECF3 0 6px,#F7F9FB 6px 12px)}
/* painted wins over empty: a painted cell with no portfolio under the
   allocations chosen still reads as painted (D158 review) */
.ne-cell.on{background:#1F5FBF;color:#fff;cursor:pointer}
.ne-cell.on small{color:#E6EEFB}
.ne-cell.clash{background:#B42318;color:#fff}
.ne-cell.clash small{color:#FFE3E0}
/* hover adds a ring and never replaces what the cell says (D158 review) */
.ne-cell:hover:not([aria-disabled="true"]){box-shadow:inset 0 0 0 2px #1F5FBF}
.ne-cell.on:hover,.ne-cell.clash:hover{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #16243A}
.ne-cell:focus-visible,.ne-hd:focus-visible,.ne-achip:focus-visible{outline:2px solid #1F5FBF;outline-offset:-3px}
.ne-cell.on:focus-visible,.ne-cell.clash:focus-visible{outline-color:#fff}
.ne-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:8px 0 0;font-size:13px;color:var(--sv-ink2)}
.ne-legend .k{display:inline-block;width:14px;height:14px;border:1px solid var(--sv-frame);border-radius:3px;margin-right:5px;vertical-align:-2px;background:var(--surface)}
.ne-legend .k.on{background:#1F5FBF;border-color:#1F5FBF}
.ne-legend .k.claimed{background:repeating-linear-gradient(135deg,#C9D3E0 0 3px,#F7F9FB 3px 6px)}
.ne-legend .k.clash{background:#B42318;border-color:#B42318}
.ne-rwall{margin:10px 0 0;font-size:13.5px;color:#173E80;line-height:1.45}
.ne-nogrid{font-size:14px;color:#6B4500;background:var(--sv-edit);border:1px solid var(--sv-edit-line);border-radius:8px;padding:10px 12px;line-height:1.45}
.ne-nogrid p{margin:0 0 8px}
.ne-nogrid p:last-child{margin:0}
.ne-nogrid .btn{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13.5px}
.ne-undo{margin:0 0 10px;font-size:13.5px;color:#173E80;background:#EAF1FC;border:1px solid #91B1E3;border-radius:6px;padding:7px 10px}
.ne-where{margin:0 0 10px}
#neWhoErr:focus{outline:none}
#neWhoErr:focus-visible .nc-err{outline:2px solid #1F5FBF;outline-offset:2px}
.sv-tile-e{font-size:13px;color:var(--sv-ink2);font-weight:400}
.sv-kept.is-gone{background:#FFF1D6;border-color:#D9AD55}
.ne-cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sv-zone);border:1px solid var(--sv-rule)}
.ne-cbar i{display:block;height:100%}
.ne-cbar i.mine,.ne-key i.mine{background:#1F5FBF}
.ne-cbar i.clash,.ne-key i.clash{background:#B42318}
.ne-cbar i.others,.ne-key i.others{background:repeating-linear-gradient(135deg,#9AA8B8 0 3px,#D5DCE5 3px 6px)}
.ne-cbar i.fb,.ne-key i.fb{background:#C9D3E0}
.ne-key{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;font-size:12.5px;color:var(--sv-ink2)}
.ne-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:640px){
  .ne-corner{min-width:110px}
  .ne-cell{min-height:40px;padding:4px}
  .ne-cell small{display:none}
  .ne-rule .repo-rule-f{grid-template-columns:1fr}
}
/* ── the catalogue kept here (D165) ──
   The card says when its values last moved and who moved them; it edits in
   place, wider while it does, two fields a row. The toolbar's second line is
   what the catalogue is and how it changes. */
.cat-own{gap:8px;padding-top:0}
.cat-own .btn{padding:6px 11px;font-size:11.5px}
.cat-own .btn.on{background:#16243A;border-color:#16243A;color:#fff}
.cat-own .cat-src{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.cat-own .prd-flash{flex-basis:100%}
.cat-stamp{display:inline-block;align-self:flex-start;font-family:var(--f-num);font-size:11.5px;font-weight:600;color:#176A33;
  background:#E6F3EC;border-radius:10px;padding:2px 9px}
.cat-stamp.gone{color:#7A4A0A;background:#FEF3C7}
.cat-tbl td.ed{white-space:nowrap;font-family:var(--f-num);font-size:12px}
.prd-flash{margin:0;font-size:12.5px;color:#176A33;background:#E6F3EC;border:1px solid #B7DCC6;border-radius:5px;padding:6px 9px}
.prd-warn{margin:0;font-size:12.5px;color:#7A4A0A;background:#FEF3C7;border:1px solid #F3D48A;border-radius:5px;padding:6px 9px}
.prd-wd{margin-left:auto;color:#9B1C1C;border-color:#E5A29B}
.prd-wd:hover{color:#9B1C1C;border-color:#9B1C1C}
.prd-ask{border:1px solid #F3D48A;background:#FFFBEB;border-radius:6px;padding:10px 11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prd-ask p{margin:0;flex-basis:100%;font-size:12.5px;color:var(--ink);line-height:1.45}
.prd-ask .prd-note{flex-basis:100%}
.prd-hist{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.prd-hh{display:flex;align-items:center;justify-content:space-between}
.prd-hh .h{font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.prd-hist-l{margin-top:8px}
.prd-hist-c{margin:3px 0 2px;padding-left:12px}
.cat-detail.prd-edit{width:460px}
/* the card's parts keep their height and the panel scrolls, rather than the
   parts being squeezed to fit it */
.cat-detail>*{flex-shrink:0}
/* the form's Save stays in reach at the foot of the panel, however long the form */
.prd-edit .prd-acts{position:sticky;bottom:-16px;margin:0 -18px -16px;padding:10px 18px 14px;background:var(--surface);
  border-top:1px solid var(--line);z-index:1}
.prd-start{display:grid;gap:6px}
.prd-start select{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);color:var(--ink)}
.prd-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.prd-f{display:grid;gap:3px;min-width:0}
.prd-f.wide{grid-column:1 / -1}
.prd-f label{font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.prd-f label small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.prd-f input,.prd-f select{font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.prd-f input[aria-invalid="true"],.prd-f select[aria-invalid="true"]{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.prd-locked{font-family:var(--f-num);font-size:13px;padding:5px 7px;border:1px dashed var(--line-strong);border-radius:4px;
  color:var(--ink-2);background:var(--surface-2);word-break:break-all}
.prd-hint{font-size:11.5px;color:var(--ink-3);min-height:0}
.prd-err{margin:0;min-height:15px;font-size:11.5px;line-height:1.3;color:#B42318}
.prd-err:empty{min-height:4px}
.prd-note{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.prd-note-l{font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.prd-note-l small{font-weight:500;text-transform:none;letter-spacing:0}
.prd-reach{display:grid;gap:6px}
.prd-reach p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.prd-reach p.warn{color:#7A4A0A;background:#FEF3C7;border-radius:5px;padding:6px 9px}
.prd-acts{align-items:center}
.prd-status{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3)}
/* the import dialog, for a product file or a fee card file */
.imp-scrim{position:absolute;inset:0;background:rgba(15,36,62,.22);z-index:8}
.imp-dlg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 40px));
  max-height:calc(100% - 60px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:0 22px 60px rgba(12,24,44,.28);padding:20px 22px;z-index:9;display:grid;gap:10px;font-size:13.5px}
.imp-dlg h3{margin:0;font-size:17px;color:var(--ink);padding-right:30px}
.imp-dlg .dlg-close{top:12px;right:14px}
.imp-lede{margin:0;color:var(--ink-2);line-height:1.5}
.imp-sum{margin:0;color:var(--ink)}
.imp-sec{border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.imp-sec summary{cursor:pointer;font-size:13px;color:var(--ink)}
.imp-sec ul{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:5px;max-height:220px;overflow:auto}
.imp-sec li small{font-family:var(--f-num);color:var(--ink-3)}
.imp-sec .rev-changes{padding-left:14px;margin:2px 0 0}
.imp-wd{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.imp-wd.off{cursor:default;color:var(--ink-3)}
.imp-lines{max-height:260px;overflow:auto;padding-left:14px}
.imp-same{margin:0;color:#7A4A0A}
.imp-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
/* ── the Fees tab (D166) ──
   The Uncalled Capital Allocation view's frame: the card read or edited in
   the main column, its files and its history at the side. */
.dialog.repo.fees{width:min(1480px,calc(100vw - 32px))}
.fee-b{grid-template-columns:minmax(0,1fr) 340px;position:relative}
.fee-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.fee-h h3{margin:0}
.fee-stamp{font-family:var(--f-num);font-size:12px;font-weight:600;color:#176A33;background:#E6F3EC;border-radius:10px;padding:2px 9px}
.fee-ph{font-family:var(--f-num);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7A4A0A;background:#FEF3C7;
  border-radius:9px;padding:1px 8px}
.fee-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 10px}
.fee-tools .spacer{flex:1}
.fee-hint{font-size:12.5px;color:var(--ink-3);line-height:1.4;max-width:540px}
.fee-eyebrow{font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.fee-in{width:72px;text-align:right;font-family:var(--f-num);font-size:13.5px;padding:4px 6px;border:1.5px solid var(--line-strong);
  border-radius:4px;background:var(--surface);color:var(--ink)}
.fee-c s{display:block;font-size:10.5px;color:var(--ink-3);text-align:right}
.fee-c.chg{background:#FFF7E0}
.fee-c.chg .fee-in{border-color:#D9A21B;font-weight:700}
.fee-c.new{background:#EEF4FC}
.fee-c.bad{background:#FDE8E8}
.fee-c.bad .fee-in{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.fee-gbox.bad .fee-gn{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
/* Group cards: the tiers along the top, then a card a row of the card */
.fee-tstrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 12px;margin:0 0 12px;
  border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
.fee-tstrip .spacer{flex:1}
.fee-tstrip .btn{padding:5px 10px;font-size:11px}
.fee-tchip{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;
  padding:3px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--line-strong)}
.fee-tchip.bad{border-color:#B42318;color:#9B1C1C;background:#FDE8E8}
.fee-arr{color:var(--ink-3)}
.fee-tpanel{border:1.5px solid var(--line-strong);border-radius:8px;padding:12px 14px;margin:-4px 0 12px;background:var(--surface)}
.fee-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
.fee-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);
  border:1.5px solid var(--line-strong);border-radius:9px}
.fee-card.chg{border-color:#D9A21B;box-shadow:0 0 0 3px rgba(217,162,27,.14)}
.fee-card.bad{border-color:#B42318;box-shadow:0 0 0 3px rgba(180,35,24,.10)}
.fee-card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fee-sch{font-family:var(--f-num);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fee-rn{font-size:15px;color:var(--ink)}
.fee-gnote{font-size:12px;color:var(--ink-3)}
.fee-ct{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.fee-ct .fee-ct-l{width:23%}
.fee-ct th{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:6px 5px 4px;text-align:right}
.fee-ct thead tr:first-child th{text-align:center;color:var(--ink-2);padding-bottom:0}
.fee-ct th.l{text-align:left;padding-left:12px}
.fee-ct tbody th{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2);white-space:nowrap;
  border-top:1px solid var(--line);padding:5px 4px 5px 12px}
.fee-ct td{padding:5px;text-align:right;border-top:1px solid var(--line)}
.fee-ct .gap{border-right:1px solid var(--line-strong)}
.fee-ct td.tg{font-weight:700}
.fee-ct.editing td{padding:3px;vertical-align:top}
.fee-ct .fee-in{width:100%;min-width:0;padding:3px 4px;font-size:12.5px}
.fee-ct td.tg .fee-in{font-weight:700}
.fee-card-f{display:flex;align-items:center;gap:12px;margin-top:auto;padding:7px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.fee-card-f .spacer{flex:1}
.fee-card.chg .fee-cstat{color:#7A4A0A}
.fee-card.bad .fee-cstat{color:#9B1C1C}
.fee-pmsg{margin:0;padding:7px 12px;font-size:12.5px;line-height:1.45;background:#EEF4FC;color:#1E4FA3;border-top:1px solid var(--line)}
.fee-pmsg.ok{background:#E6F3EC;color:#176A33}
.fee-pmsg.bad{background:#FDE8E8;color:#9B1C1C}
.fee-pmsg .cat-link{margin-left:6px}
.fee-list + .fee-pmsg,.fee-tools ~ .fee-pmsg{border:0;border-radius:6px;margin:0 0 10px}
.fee-newg{border-style:dashed;padding:12px 14px;justify-content:center}
.fee-newg h4,.fee-listadd h4{margin:0 0 4px;font-size:14px;color:var(--ink)}
/* Price list: one source, the groups down and the tiers across */
.fee-listwrap{overflow-x:auto}
.fee-list{width:100%;min-width:820px;border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--surface);
  border:1.5px solid var(--line-strong);border-radius:8px}
.fee-list .fee-lg{width:20%}
.fee-list thead th{padding:9px 8px;text-align:center;vertical-align:bottom;font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--surface-2);border-bottom:1.5px solid var(--line-strong);border-left:1px solid var(--line)}
.fee-list thead th.l{text-align:left;border-left:0;font-family:var(--f-num);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fee-list thead th.bad{background:#FDE8E8}
.fee-lt{display:block}
.fee-list .fee-te{display:flex;justify-content:center;margin-top:5px;font-weight:400}
.fee-tacts{display:flex;justify-content:center;gap:10px;margin-top:4px}
.fee-list tbody th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:middle}
.fee-list tbody th .fee-sch{display:block;font-weight:400}
.fee-gline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-weight:400}
.fee-list tbody tr.chg th{box-shadow:inset 3px 0 0 #D9A21B}
.fee-list tbody tr.bad th{box-shadow:inset 3px 0 0 #B42318}
.fee-list td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.fee-list tbody tr:last-child td,.fee-list tbody tr:last-child th{border-bottom:0}
.fee-big{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.fee-rng{display:block;margin-top:3px;font-family:var(--f-num);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fee-lc.chg{background:#FFF7E0}
.fee-lc.bad{background:#FDE8E8}
.fee-lc.open{box-shadow:inset 0 0 0 2px #D9A21B;padding:6px}
.fee-lb{appearance:none;background:none;border:0;width:100%;padding:2px 0;border-radius:5px;cursor:pointer;color:inherit}
.fee-lb:hover{background:var(--surface-2)}
.fee-lb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fee-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:left}
.fee-trio label{display:block;margin:0 0 2px;font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fee-trio .fee-c{border-radius:4px;padding:2px}
.fee-trio .fee-in{width:100%;min-width:0;padding:3px 4px;font-size:13px}
.fee-listadd{margin-top:14px;padding:12px 14px;border:1.5px dashed var(--line-strong);border-radius:8px}
.fee-help{margin:0 0 10px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.fee-tiers{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fee-tiers li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fee-tiers li.bad .fee-edge,.fee-list th.bad .fee-edge{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.fee-gn{font:inherit;font-size:13.5px;padding:4px 7px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface);

.fee-x,.fee-tiers .btn{padding:3px 8px;font-size:11px}
.fee-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.fee-add input,.fee-add select{font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);color:var(--ink)}
.fee-add input{width:170px}
.fee-tl{font-weight:600;color:var(--ink);min-width:130px;font-size:13px}
.fee-te{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px}
.fee-edge{width:62px;text-align:right;font-family:var(--f-num);font-size:13px;padding:3px 6px;border:1.5px solid var(--line-strong);
  border-radius:4px;background:var(--surface);color:var(--ink)}
.fee-files{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.fee-files .btn{padding:6px 11px;font-size:11.5px}
.fee-hl{margin:4px 0 2px;padding-left:12px}

<script>
(function () {

/* =============================================================================

   below the strategic allocations. Choosing it opens Implementation on a

   portfolio, the categories follow from them, and the risk profile sets the
   limits. There is no starting point, so nothing "stood at" anything, and
   the rail has no sleeve pickers, no "By sleeve" and no overlay switches.

   library, the seven USD Full portfolios as analysed, the proposal as it
   stands (Moderate Full, its five sleeves and the two overlays, at $250m),
   the fee card at this mandate's tier and the long-term estimates. Nothing

var D = window.WPB_DATA;

var ROUND_TO = 100;
var BALANCE = 0.005;
var EPS = 1e-9;
var MAX_COMPARISONS = 3;
var USERS = {
  specialist: { key: 'specialist', id: 'jtaylor', label: 'Specialist', canApprove: false },
  admin: { key: 'admin', id: 'fbarker', label: 'Admin', canApprove: true },
  pwa: { key: 'pwa', id: 'bmorgan', label: 'PWA', canApprove: false }
};
/* the strategic side of the prototype implements one portfolio with sleeves */
var STRATEGIC = 'Moderate';
var ALLOCATIONS = ['Full', 'Core', 'ex-Alts', 'ex-HFs'];
var PROFILES = ['LowVol', 'Conservative', 'ConsMod', 'Moderate', 'ModAgg', 'Agg', 'Higher Risk'].filter(function (k) { return D.saas[k]; });
function profileName(k) { return String((D.saas[k] || {}).header || k).replace(/ Full$/, ''); }

/* ---- reference data -------------------------------------------------------- */

function onType(pid) { return !!TYPE_CAT[pid]; }
function universe() { return D.products.filter(function (p) { return S.policy.universe === 'all' || onType(p.productId); }); }

var CLASS_CAT = (function () {
  var counts = {}, out = {};
  D.products.forEach(function (p) {
    (D.catmap[p.productId] || []).forEach(function (c) {

    });
  });
  Object.keys(counts).forEach(function (a) {
    out[a] = Object.keys(counts[a]).sort(function (x, y) { return counts[a][y] - counts[a][x]; })[0];
  });
  return out;
})();

/* the long-term estimates per line, each line's assets weighted as Moderate

var EST = {};
D.estimates.forEach(function (e) { EST[e.reportingName] = e; });
var CSTAT = (function () {
  var acc = {};
  SAA.categories.forEach(function (c) {
    var line = lineOf(c.name);
    (c.assets || []).forEach(function (a) {
      var e = EST[a.reportingName]; if (!e) return;
      var t = acc[line] || (acc[line] = { w: 0, r: 0, v: 0 });

    });
  });
  D.estimates.forEach(function (e) {
    var line = lineOf(e.category); if (acc[line]) return;
    acc[line] = { w: 1, r: e.totalReturn * 100, v: e.volatility * 100 };
  });

})();

function profileLines(k) {

}

  });
  return out;
}

/* ---- helpers ------------------------------------------------------------------ */
function esc(s) {

function money(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : '$' + Math.round(v).toLocaleString('en-US'); }
function pct(v, dp) { dp = dp == null ? 2 : dp; return (Math.round(v * Math.pow(10, dp)) / Math.pow(10, dp)).toFixed(dp) + '%'; }
function fmt2(v) { return (Math.round(Number(v) * 100) / 100).toFixed(2); }
function plural(n, w) { return n + ' ' + (n === 1 ? w : /y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'); }
function bpText(v) { return v === null || v === undefined ? '—' : (Math.round(v * 10) / 10).toFixed(1) + 'bp'; }
function rng(r) { return (Math.round(r[0] * 100) / 100) + '–' + (Math.round(r[1] * 100) / 100) + '%'; }
function user() {
  var u = USERS[S.role] || USERS.specialist;
  return Object.assign({}, u, { canBuild: u.key !== 'pwa' || !!S.policy.pwaCustom });
}
function announce(text) {

  el.textContent = ''; window.setTimeout(function () { el.textContent = text; }, 30);
}
function quoted(t) { t = String(t || '').trim(); return '“' + t + '”' + (/[.!?]$/.test(t) ? '' : '.'); }
function nowText() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
/* to 2dp, closing on exactly *target* by largest remainder */
function scaleTo(values, target) {
  var sum = values.reduce(function (a, b) { return a + b; }, 0);
  if (!(sum > 0)) return values.map(function () { return 0; });
  var exact = values.map(function (v) { return v / sum * target; });
  var units = exact.map(function (v) { return Math.floor(v * 100 + 1e-9); });
  var short = Math.round(target * 100) - units.reduce(function (a, b) { return a + b; }, 0);
  exact.map(function (v, i) { return { i: i, r: v * 100 - units[i] }; })
    .sort(function (a, b) { return (b.r - a.r) || (a.i - b.i); })
    .slice(0, Math.max(0, short)).forEach(function (o) { units[o.i] += 1; });
  return units.map(function (u) { return u / 100; });
}
/* a typed weight: '' is nothing yet, otherwise up to 100 with at most two places */
function weightOf(text) {
  var t = String(text == null ? '' : text).trim().replace(/%$/, '').trim();
  if (t === '') return 0;
  if (!/^(\d{1,3}(\.\d{0,2})?|\.\d{1,2})$/.test(t)) return NaN;
  var v = parseFloat(t);

}

}
/* every change to the build: who made it, and an approval it no longer matches goes */
function edited() { S.builtBy = user().id; voidApproval('portfolio'); }

/* ---- the model -------------------------------------------------------------------- */
function model(custom) {
  var rows = custom ? (S.rows || []) : startRows();
  var base = custom ? profileLines(S.profile) : REF;
  var lines = {}, order = CAT_ORDER.slice();
  function line(cat) {
    if (!lines[cat]) { lines[cat] = { cat: cat, items: [], w: 0, ref: custom ? 0 : (REF[cat] || 0), cost: 0, mgmtW: 0, mgmtKnown: true, bp: 0, bpKnown: true, notional: 0 }; }
    if (order.indexOf(cat) === -1) order.push(cat);
    return lines[cat];
  }
  var m = { count: rows.length, total: 0, bad: 0, zero: 0, below: [], notional: 0, bp: 0, bpKnown: true,
            costW: 0, illiquid: 0, priv: 0, unsure: 0, lines: [], custom: custom, largest: null, over: [] };
  rows.forEach(function (r) {
    var p = PROD[r.id]; if (!p) return;
    var w = weightOf(r.w), it = { row: r, p: p, w: isNaN(w) ? 0 : w, bad: isNaN(w), zero: !isNaN(w) && w === 0 };
    it.notional = Math.round(S.mandate * it.w / 100 / ROUND_TO) * ROUND_TO;
    it.below = !!p.minimumInvestment && it.w > 0 && it.notional < p.minimumInvestment;
    it.mgmt = mgmtFee(p.feeGroup);
    it.bp = it.mgmt === null ? null : (p.productCost + it.mgmt) * it.w;
    it.home = homeOf(r.id);
    it.unsure = custom && !it.home.sure;
    var L = line(r.cat);
    L.items.push(it); L.w += it.w; L.notional += it.notional; L.cost += p.productCost * it.w;
    if (it.mgmt === null) L.mgmtKnown = false; else L.mgmtW += it.mgmt * it.w;
    if (it.bp === null) L.bpKnown = false; else L.bp += it.bp;
    m.total += it.w; m.notional += it.notional; m.costW += p.productCost * it.w;
    if (it.bp === null) m.bpKnown = false; else m.bp += it.bp;
    if (it.bad) m.bad += 1;
    if (it.zero) m.zero += 1;
    if (it.below) m.below.push(it);
    if (p.liquidity !== 'Daily') m.illiquid += it.w;
    if (r.cat === PRIVATE_LINE) m.priv += it.w;
    if (it.unsure) m.unsure += 1;
    if (!m.largest || it.w > m.largest.w) m.largest = it;
    if (custom && it.w > S.policy.conc + EPS) m.over.push(it);
  });
  order.forEach(function (c) { var L = lines[c] || (base[c] ? line(c) : null); if (L) m.lines.push(L); });
  m.lines.forEach(function (L) { L.w = Math.round(L.w * 1e6) / 1e6; });
  m.total = Math.round(m.total * 1e6) / 1e6;
  m.balanced = Math.abs(m.total - 100) < BALANCE;
  if (custom) {
    var lim = limitsFor(S.profile, m.lines.map(function (L) { return L.cat; }));
    /* over a limit is over it however much is still to place; under one
       only counts once the portfolio adds to 100% */
    m.lines.forEach(function (L) {
      L.lim = lim[L.cat];
      L.out = L.w > L.lim.hard[1] + EPS || (m.balanced && L.w < L.lim.hard[0] - EPS);
      L.wide = !L.out && (L.w > L.lim.soft[1] + EPS || (m.balanced && L.w < L.lim.soft[0] - EPS));
    });
  }
  var anchor = D.saas[custom ? S.profile : STRATEGIC];
  m.ret = m.lines.reduce(function (t, L) { return t + L.w / 100 * ((CSTAT[L.cat] || {}).ret || 0); }, 0);
  m.volCap = m.lines.reduce(function (t, L) { return t + L.w / 100 * ((CSTAT[L.cat] || {}).vol || 0); }, 0);
  var anchorCap = anchor.categories.reduce(function (t, c) { return t + c.weightPct / 100 * ((CSTAT[lineOf(c.name)] || {}).vol || 0); }, 0);
  m.volIndicative = anchorCap > 0 ? anchor.metrics.volatilityPct * m.volCap / anchorCap : null;
  m.anchor = anchor;
  m.nearest = nearestStrategic(m.lines);
  return m;
}
/* the analysed portfolio nearest the build: the overlays counted where they
   are funded from, Investment Grade Fixed Income */
function nearestStrategic(lines) {
  var built = {};
  lines.forEach(function (L) {
    var k = (L.cat === 'Hybrid Fixed Income' || L.cat === 'Asset Allocation Strategies') ? 'Investment Grade Fixed Income' : L.cat;
    built[k] = (built[k] || 0) + L.w;
  });
  var best = null;
  PROFILES.forEach(function (rk) {
    var s = profileLines(rk);
    var keys = {}; Object.keys(s).concat(Object.keys(built)).forEach(function (k) { keys[k] = 1; });
    var d = Object.keys(keys).reduce(function (t, k) { return t + Math.abs((built[k] || 0) - (s[k] || 0)); }, 0) / 2;
    if (!best || d < best.d) best = { rk: rk, d: d, p: D.saas[rk] };
  });
  return best;
}

/* ---- the checks ------------------------------------------------------------------- */
function checks(m) {
  var pol = S.policy, out = [], status = 'ok', prof = profileName(S.profile);
  function add(kind, text) {
    out.push([kind, text]);
    if (kind === 'bad') status = 'bad'; else if (kind === 'warn' && status === 'ok') status = 'warn';
  }
  if (!m.count) { add('bad', 'Nothing built yet: add products, paste them from Excel or insert a sleeve.'); return { status: status, list: out }; }
  if (m.bad) add('bad', plural(m.bad, 'weight') + ' to fix: a weight is a percentage of the portfolio, up to two places.');
  if (m.zero) add('bad', plural(m.zero, 'product') + ' with no weight yet: give each one a weight, or remove it.');
  if (m.balanced) add('ok', 'Adds to 100.00%.');
  else add('bad', 'Adds to ' + pct(m.total) + ': ' + pct(Math.abs(100 - m.total)) + (m.total < 100 ? ' still to place.' : ' too much.'));
  if (m.below.length) {
    add('bad', plural(m.below.length, 'position') + ' below the product’s minimum at this mandate: '
      + m.below.map(function (it) { return it.p.name + ' (' + money(it.notional) + ' against ' + money(it.p.minimumInvestment) + ')'; }).join(', ') + '.');
  } else add('ok', 'Every position meets its product’s minimum.');
  if (m.count > pol.maxProducts) add('bad', plural(m.count, 'product') + '; at most ' + pol.maxProducts + '.');
  var outside = m.lines.filter(function (L) { return L.out; }), wide = m.lines.filter(function (L) { return L.wide; });
  if (outside.length) {
    add('bad', outside.map(function (L) { return L.cat + ' at ' + pct(L.w) + ' (' + rng(L.lim.hard) + ')'; }).join(', ')
      + (outside.length === 1 ? ' is' : ' are') + ' outside what the ' + prof + ' profile allows.');
  } else if (!wide.length) {
    if (m.balanced) add('ok', 'Every category within the ' + prof + ' profile’s usual range.');
    else add('mute', 'Each category is held to the ' + prof + ' profile’s range once the portfolio adds to 100%.');
  }
  if (m.over.length) add('bad', m.over.map(function (it) { return it.p.name + ' at ' + pct(it.w); }).join(', ') + ': a single product holds at most ' + pol.conc + '% of the portfolio.');
  else add('ok', 'No product above ' + pol.conc + '% of the portfolio.');
  if (m.illiquid > pol.illiquid + EPS) add('bad', pct(m.illiquid) + ' is not daily-dealing; at most ' + pol.illiquid + '%.');
  if (m.priv > 0 && S.mandate < D.privateMinimum) add('bad', 'Private markets need a mandate of ' + money(D.privateMinimum) + ' or more.');
  if (m.unsure) add('mute', plural(m.unsure, 'product') + ' no sleeve holds: '
    + (m.unsure === 1 ? 'its category was' : 'their categories were') + ' suggested from the asset class. Check '
    + (m.unsure === 1 ? 'it' : 'them') + ' in the table.');
  if (wide.length) {
    add(status === 'bad' ? 'mute' : 'warn', wideText(wide) + (status === 'bad' ? ' It will need an admin’s approval too.' : ' An admin approves it before it downloads.'));
  }
  return { status: status, list: out };
}
/* the verdict as the approval stands: approved outside the usual range is deliverable */
function verdictOf(c) {
  if (c.status !== 'warn') return { tone: c.status, label: c.status === 'ok' ? 'Deliverable' : 'Not deliverable' };
  var a = S.approval;
  if (a && a.state === 'approved') return { tone: 'ok', label: 'Approved', by: a.by };
  if (a && a.state === 'submitted') return { tone: 'warn', label: 'Awaiting approval' };
  return { tone: 'warn', label: 'Needs approval' };
}
function wideText(wide) {
  return wide.map(function (L) { return L.cat + ' at ' + pct(L.w); }).join(', ') + (wide.length === 1 ? ' is' : ' are')
    + ' outside the ' + profileName(S.profile) + ' profile’s usual range (' + wide.map(function (L) { return rng(L.lim.soft); }).join(', ') + ').';
}

/* ---- the composition doughnuts, as the tool draws them ---------------------------- */
function donutsHtml(m) {
  var dims = [['style', 'Style'], ['vehicle', 'Vehicle'], ['source', 'Source'], ['liquidity', 'Liquidity'], ['exposureCurrency', 'Exposure currency']];
  var items = []; m.lines.forEach(function (L) { L.items.forEach(function (it) { if (it.w > 0) items.push(it); }); });
  if (!items.length) return '';
  var C = 2 * Math.PI * 52;
  var cards = dims.map(function (d) {
    var by = {}, total = 0;
    items.forEach(function (it) { var k = it.p[d[0]] || '—'; by[k] = (by[k] || 0) + it.w; total += it.w; });
    var keys = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    var alpha = Object.keys(by).sort();
    var off = 0, arcs = '', key = '';
    keys.forEach(function (k) {
      var share = by[k] / total, len = share * C, colour = 'var(--cat-' + (alpha.indexOf(k) % 8 + 1) + ')';
      arcs += '<circle class="dn-arc" cx="66" cy="66" r="52" fill="none" stroke="' + colour + '" stroke-width="22" stroke-dasharray="' + len.toFixed(3) + ' ' + (C - len).toFixed(3)
        + '" stroke-dashoffset="' + (-off).toFixed(3) + '"><title>' + esc(k) + ' ' + (share * 100).toFixed(1) + '%</title></circle>';
      key += '<li><span class="dn-sw" style="background:' + colour + '"></span><span class="dn-nm">' + esc(k) + '</span><span class="dn-pc">' + (share * 100).toFixed(1) + '%</span></li>';
      off += len;
    });
    return '<div class="dn-card"><h4>' + d[1] + '</h4><svg class="dn" viewBox="0 0 132 132" role="img" aria-label="' + esc(d[1]) + '">' + arcs + '</svg><ul class="dn-key">' + key + '</ul></div>';
  }).join('');
  return '<div class="impl-viz"><div class="impl-viz-head"><h3>Composition of the Implemented Model</h3><p class="sec-note">Share of allocation by product attribute.</p></div><div class="dn-row">' + cards + '</div></div>';
}

/* ---- the gate and the download card -------------------------------------------------- */
function gateFor(m, c) {
  var u = user();
  if (!m.custom) {
    if (m.below.length) {
      var names = m.below.map(function (it) { return it.p.name; }).join(', ');
      return { tone: 'error', head: m.below.length + ' below minimum', text: plural(m.below.length, 'position') + ' below mandate minimum: ' + names + '. Raise the mandate or change the sleeve.', btn: { label: 'Download proposal', disabled: true } };
    }
    return { tone: 'ready', head: 'Ready to download', text: 'Ready — every category is implemented and the scenario is saved.', btn: { label: 'Download proposal', act: 'download' } };
  }
  if (!m.count) return { tone: 'error', head: 'Nothing built yet', text: 'Add products, paste them from Excel or insert a sleeve.', btn: { label: 'Download proposal', disabled: true } };
  if (c.status === 'bad') {
    var first = c.list.filter(function (x) { return x[0] === 'bad'; });
    return { tone: 'error', head: 'Not deliverable', text: first.map(function (x) { return x[1]; }).join(' '), btn: { label: 'Download proposal', disabled: true } };
  }
  if (c.status === 'ok') return { tone: 'ready', head: 'Ready to download', text: 'Ready — the portfolio adds to 100.00%, every check passes and the scenario is saved.', btn: { label: 'Download proposal', act: 'download' } };
  var a = S.approval, why = wideText(m.lines.filter(function (L) { return L.wide; }));
  if (!a || a.state === 'returned') {
    return { tone: 'blocked', head: 'Needs approval', text: (a ? 'Sent back by ' + a.by + ': ' + quoted(a.reason) + ' ' : '') + why + ' An admin approves it before it downloads.',
      btn: u.canBuild ? { label: 'Submit for approval', act: 'submit', primary: true } : { label: 'Download proposal', disabled: true } };
  }
  if (a.state === 'submitted') {
    if (u.canApprove && u.id !== a.builder) {
      return { tone: 'blocked', head: 'Awaiting your approval', text: 'Submitted by ' + a.builder + ' at ' + a.at + ': ' + quoted(a.note) + ' ' + why, btns: [{ label: 'Send back', act: 'return' }, { label: 'Approve', act: 'approve', primary: true }] };
    }
    if (u.canApprove && u.id === a.builder) {
      return { tone: 'blocked', head: 'Awaiting approval', text: 'Submitted at ' + a.at + '. You built it, so another admin approves it.', btns: [{ label: 'Withdraw', act: 'withdraw' }] };
    }
    return { tone: 'blocked', head: 'Awaiting approval', text: 'Submitted by ' + a.builder + ' at ' + a.at + ': ' + quoted(a.note) + ' An admin approves it or sends it back.', btns: u.canBuild ? [{ label: 'Withdraw', act: 'withdraw' }] : [] };
  }
  return { tone: 'ready', head: 'Approved', text: 'Approved by ' + a.by + ' at ' + a.decidedAt + '. Ready to download.', btn: { label: 'Download proposal', act: 'download' } };
}
function exportHtml(m, c) {

var PASTE_SAMPLE = 'Product\tWeight\nGSAM Core Municipal SMA\t12%\nGSAM Intermediate Credit SMA\t14\nGS Access Treasury 0-1 ETF\t6\nGS High Yield Fund\t4\nGS Emerging Markets Debt\t4\nGS Access US Large Cap ETF\t22\nGS Access Intl Equity ETF\t11\nGS Access EM Equity ETF\t6\nGS HedgeWorks Multi-Strategy\t6\nGS Absolute Return Tracker\t5\nGS Private Markets Buyout\t5\nGS Private Credit Partners\t5';
function parsePaste(text) {
  var rows = [], errors = [], seen = {}, pool = universe();
  String(text || '').split(/\r\n|\r|\n/).forEach(function (line, i) {
    if (!line.trim()) return;
    var cells = line.split('\t').map(function (c) { return c.trim(); });
    if (cells.length < 2) cells = line.split(/\s{2,}|,(?=\s*\d)/).map(function (c) { return c.trim(); });
    var name = cells[0], wText = (cells[cells.length - 1] || '').replace('%', '').trim();
    var w = parseFloat(wText);
    if (isNaN(w)) { if (i === 0) return; errors.push('Line ' + (i + 1) + ': “' + (cells[cells.length - 1] || '') + '” is not a weight.'); rows.push({ line: i + 1, name: name, bad: 'not a weight' }); return; }
    var key = name.toLowerCase();
    var match = function (x) { return x.name.toLowerCase() === key || x.productId.toLowerCase() === key || (x.ticker && x.ticker !== '—' && x.ticker.toLowerCase() === key); };
    var p = pool.filter(match)[0];
    if (!p) {
      var elsewhere = D.products.filter(match)[0];
      if (elsewhere) { errors.push('Line ' + (i + 1) + ': ' + elsewhere.name + ' is not on ' + D.variant + '’s list.'); rows.push({ line: i + 1, name: name, w: w, bad: 'not on the type’s list' }); return; }
      errors.push('Line ' + (i + 1) + ': no product called “' + name + '”.'); rows.push({ line: i + 1, name: name, w: w, bad: 'no such product' }); return;
    }
    if (seen[p.productId]) { errors.push('Line ' + (i + 1) + ': ' + p.name + ' is in the block twice.'); rows.push({ line: i + 1, name: name, w: w, bad: 'twice' }); return; }
    if (w < 0 || w > 100 || Math.abs(Math.round(w * 100) - w * 100) > 1e-6) {
      errors.push('Line ' + (i + 1) + ': ' + w + ' is not a weight to two places.'); rows.push({ line: i + 1, name: name, w: w, bad: 'not to two places' }); return;
    }
    seen[p.productId] = 1;
    rows.push({ line: i + 1, p: p, w: w });
  });
  var total = rows.reduce(function (t, r) { return t + (r.p ? r.w : 0); }, 0);
  return { rows: rows, errors: errors, total: Math.round(total * 100) / 100 };
}

  if (el.id === 'wpAddQ') { S.dlg.q = el.value; renderDlg(); var q = document.getElementById('wpAddQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  if (el.id === 'wpPaste') {
    S.dlg.text = el.value;
    var pos = el.selectionStart; renderDlg();
    var p2 = document.getElementById('wpPaste'); p2.focus(); p2.setSelectionRange(pos, pos); return;
  }
  if (el.id === 'wpSlW') {
    S.dlg.w = el.value; S.dlg.touched = true;
    var at = el.selectionStart; renderDlg();
    var sw = document.getElementById('wpSlW'); sw.focus(); sw.setSelectionRange(at, at); return;
  }
  if (el.id === 'wpReason') { S.dlg.reason = el.value; var go = document.querySelector('[data-returngo]'); if (go) go.disabled = !el.value.trim(); return; }
  if (el.id === 'wpNote') { S.dlg.note = el.value; return; }
  var map = { ppSoft: 'soft', ppHard: 'hard', ppConc: 'conc', ppIlliquid: 'illiquid', ppMax: 'maxProducts' };
  if (map[el.id]) { var v = Number(el.value); if (!isNaN(v) && el.value !== '') { S.policy[map[el.id]] = v; render(); } return; }
  if (el.id === 'ppMandate') { var mv = Number(el.value); if (mv >= 1) { S.mandate = Math.round(mv * 1e6); render(); } return; }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'bpa') {
    var want = el.value === 'custom' ? 'custom' : 'strategic';
    S.confirm = want === S.kind ? null : (want === 'custom' ? 'toCustom' : 'toStrategic');
    render(); if (S.confirm) focusSel('[data-confirm-yes]');
    return;
  }
  if (el.id === 'bpr') {
    S.profile = el.value; voidApproval('risk profile'); render();
    announce('Risk profile ' + profileName(S.profile) + ': the limits changed, the build did not.'); return;
  }
  if (el.id === 'wpCmp') {
    if (el.value && S.comps.indexOf(el.value) === -1 && S.comps.length < MAX_COMPARISONS) S.comps.push(el.value);
    render(); focusSel('#wpCmp'); return;
  }
  if (el.name === 'wpSleeve') {
    var d = S.dlg; d.ix = Number(el.value);
    if (!d.touched) d.w = sleeveDefaultW(LIB[d.ix]);
    renderDlg();
    var r2 = document.querySelector('input[name="wpSleeve"][value="' + d.ix + '"]'); if (r2) r2.focus(); return;
  }
  if (el.dataset && el.dataset.w !== undefined) {
    var r = S.rows.filter(function (x) { return x.id === el.dataset.w; })[0]; if (!r) return;
    var w = weightOf(r.w); if (!isNaN(w) && r.w !== '') r.w = fmt2(w);
    if (S._snap !== undefined && S._snap !== snapshot()) pushHistory(S._snap);
    S._snap = undefined; render(); return;
  }
  if (el.dataset && el.dataset.cat !== undefined) {
    pushHistory();
    var rr = S.rows.filter(function (x) { return x.id === el.dataset.cat; })[0]; rr.cat = el.value;
    edited(); render(); announce(PROD[rr.id].name + ' counted in ' + el.value + '.'); return;
  }
  if (el.dataset && el.dataset.scale !== undefined) { scaleCategory(el.dataset.scale, el.value); return; }
  if (el.dataset && el.dataset.filter) { S.dlg.f[el.dataset.filter] = el.value; renderDlg(); var fs = document.querySelector('[data-filter="' + el.dataset.filter + '"]'); if (fs) fs.focus(); return; }
  if (el.dataset && el.dataset.tick) {
    var t = S.dlg.ticked, at = t.indexOf(el.dataset.tick);
    if (el.checked && at === -1) t.push(el.dataset.tick); else if (!el.checked && at !== -1) t.splice(at, 1);
    var keep = el.dataset.tick; renderDlg(); var tb = document.querySelector('[data-tick="' + keep + '"]'); if (tb) tb.focus(); return;
  }
  if (el.id === 'wpOnlyBad') { S.onlyBad = el.checked; render(); return; }
  if (el.id === 'implincfees') { S.fees.include = el.checked; render(); return; }
  if (el.id === 'ppPwa') { S.policy.pwaCustom = el.checked; S.confirm = null; render(); return; }
  if (el.id === 'ppUniverse') { S.policy.universe = el.value; render(); return; }
  if (el.id === 'ppRef') { S.policy.ref = el.checked; render(); return; }
});
document.addEventListener('focusin', function (e) {
  if (e.target.dataset && e.target.dataset.w !== undefined && S._snap === undefined) S._snap = snapshot();
});
document.addEventListener('keydown', function (e) {
  if (S.dlg && e.key === 'Escape') { e.preventDefault(); closeDlg(); return; }
  if (!S.dlg && S.confirm && e.key === 'Escape') { e.preventDefault(); S.confirm = null; render(); focusSel('#bpa'); return; }
  var el = e.target;
  if (el.id === 'wpSlW' && e.key === 'Enter') { e.preventDefault(); insertSleeve(); return; }
  if (el.dataset && el.dataset.scale !== undefined && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
  if (el.dataset && el.dataset.w !== undefined && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    var all = Array.prototype.slice.call(document.querySelectorAll('input.wp-w[data-w]')).filter(function (x) { return x.offsetParent !== null; });
    var at = all.indexOf(el), next = all[at + (e.key === 'ArrowUp' ? -1 : 1)];
    el.blur();
    if (next) { var id = next.id; window.setTimeout(function () { var n = document.getElementById(id); if (n) { n.focus(); n.select(); } }, 0); }
    return;
  }
  var inField = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT';
  if (!inField && !S.dlg && S.kind === 'custom' && S.step === 'impl' && (e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    var btn = document.querySelector('[data-act="' + (e.shiftKey ? 'redo' : 'undo') + '"]'); if (btn && !btn.disabled) btn.click();
  }
});

render();
})();

</script>
</body>
</html>
